    // Pre-fill first row from saved record (Edit mode)
    var firstRow = document.querySelector('#pur-entries-body tr');
    if (firstRow && adj) {
      var prodWrapper = firstRow.querySelector('[data-sr="product"]');
      if (prodWrapper) setPurSearchableValue(prodWrapper, adj.product || '', adj.product || '');
      var catSel = firstRow.querySelector('[data-f="category"]');
      if (catSel) catSel.value = adj.category || '';
      var brandSel = firstRow.querySelector('[data-f="brand"]');
      if (brandSel) brandSel.value = adj.brand || '';
      var modelIn = firstRow.querySelector('[data-f="model"]');
      if (modelIn) modelIn.value = adj.model || '';
      var serialIn = firstRow.querySelector('[data-f="serial"]');
      if (serialIn) serialIn.value = adj.serial || '';
      var condSel = firstRow.querySelector('[data-f="condition"]');
      if (condSel) condSel.value = adj.condition || 'New';
      var warSel = firstRow.querySelector('[data-f="warranty"]');
      if (warSel) warSel.value = adj.warranty || '';
      var qtyIn = firstRow.querySelector('[data-f="qty"]');
      if (qtyIn) qtyIn.value = adj.qty || 0;
      var uomIn = firstRow.querySelector('[data-f="uom"]');
      if (uomIn) uomIn.value = adj.uom || '';
      var remIn = firstRow.querySelector('[data-f="remarks"]');
      if (remIn) remIn.value = adj.remarks || '';
    }
    bindPurRowDel(firstRow);
    bindAllPurSearchable(box, adjProductSelectCb);

    document.getElementById('btn-adj-addrow').addEventListener('click', function() {
      var tbody = document.getElementById('pur-entries-body');
      var tr = document.createElement('tr');
      tr.innerHTML = adjustmentTableRowHTML(catOpts, brandOpts, warOpts, prdArr);
      tbody.appendChild(tr);
      bindPurRowDel(tr);
      bindAllPurSearchable(tr, adjProductSelectCb);
    });

    document.getElementById('btn-save-adj').addEventListener('click', function() {
      var ref = document.getElementById('f-adj-ref').value.trim();
      var date = document.getElementById('f-adj-date').value;
      if (!date) { showToast('Date required', 'error'); return; }
      var branch = ''; // Branch removed from modal
      var status = document.getElementById('f-adj-status').value;
      var noteEl = document.getElementById('f-adj-note');
      var note = noteEl ? noteEl.value.trim() : '';
      // Read first valid row
      var rows = document.querySelectorAll('#pur-entries-body tr');
      var firstValid = null;
      for (var ri = 0; ri < rows.length; ri++) {
        var pSel = rows[ri].querySelector('[data-f="product"]');
        if (pSel && pSel.value) { firstValid = rows[ri]; break; }
      }
      if (!firstValid) { showToast('Add at least one product', 'error'); return; }
      var productValue = firstValid.querySelector('[data-f="product"]').value;
      // The dropdown value may include a '||serial' suffix used for unique
      // identification of each purchase row. Strip it to get the clean product name.
      var product = stripProductSerialSuffix(productValue);
      var category = firstValid.querySelector('[data-f="category"]').value;
      var brand = firstValid.querySelector('[data-f="brand"]').value;
      var model = firstValid.querySelector('[data-f="model"]').value;
      var serial = firstValid.querySelector('[data-f="serial"]').value;
      var condition = firstValid.querySelector('[data-f="condition"]').value;
      var warranty = firstValid.querySelector('[data-f="warranty"]').value;
      var qty = parseFloat(firstValid.querySelector('[data-f="qty"]').value) || 0;
      var remarks = firstValid.querySelector('[data-f="remarks"]').value;
      var bqtyVal = parseFloat(firstValid.querySelector('[data-f="bqty"]').value) || 0;
      // Type removed — adjustments always decrease stock (Decrease)
      var type = 'Decrease';
      var absQty = Math.abs(qty);
      if (adj) {
        adj.ref = ref; adj.date = date; adj.branch = branch;
        adj.product = product; adj.category = category; adj.brand = brand;
        adj.model = model; adj.serial = serial; adj.condition = condition;
        adj.warranty = warranty; adj.qty = absQty; adj.type = type;
        adj.bqty = bqtyVal; adj.uom = firstValid.querySelector('[data-f="uom"]') ? firstValid.querySelector('[data-f="uom"]').value : '';
        adj.reason = remarks; adj.remarks = remarks; adj.note = note; adj.status = status;
        closeModal(); showToast('Adjustment updated'); renderPage(); saveDBNow(null, { skipMerge: true });
      } else {
        DB.adjustments.push({
          id: Date.now(), ref: ref, date: date, branch: branch,
          product: product, category: category, brand: brand, model: model,
          serial: serial, condition: condition, warranty: warranty,
          bqty: bqtyVal, qty: absQty, uom: document.querySelector('[data-f="uom"]') ? document.querySelector('[data-f="uom"]').value : '', type: type, reason: remarks, remarks: remarks, note: note, status: status
        });
        closeModal(); showToast('Adjustment added'); renderPage(); saveDBNow(null, { skipMerge: true });
      }
    });
  }
}

function bindQuotationEvents() {
  var addBtn = document.getElementById('btn-add-quotation');
  if (addBtn) addBtn.addEventListener('click', function() { openQuotationModal(null); });
  var viewBtns = document.querySelectorAll('[data-view-quote]');
  for (var v = 0; v < viewBtns.length; v++) { (function(b) { b.addEventListener('click', function() { openQuotationModal(parseInt(b.getAttribute('data-view-quote')), true); }); })(viewBtns[v]); }
  var editBtns = document.querySelectorAll('[data-edit-quote]');
  for (var e = 0; e < editBtns.length; e++) { (function(b) { b.addEventListener('click', function() { openQuotationModal(parseInt(b.getAttribute('data-edit-quote')), false); }); })(editBtns[e]); }
  var delBtns = document.querySelectorAll('[data-del-quote]');
  for (var d = 0; d < delBtns.length; d++) { (function(b) { b.addEventListener('click', function() { deleteItem('quotations', parseInt(b.getAttribute('data-del-quote')), 'quotation-list'); }); })(delBtns[d]); }
  // Print Sell Proposal
  var printBtns = document.querySelectorAll('[data-print-quote]');
  for (var p = 0; p < printBtns.length; p++) {
    (function(b) {
      b.addEventListener('click', function() { printQuotation(parseInt(b.getAttribute('data-print-quote'))); });
    })(printBtns[p]);
  }
  // Convert to Invoice
  var convertBtns = document.querySelectorAll('[data-convert-invoice]');
  for (var c = 0; c < convertBtns.length; c++) {
    (function(b) {
      b.addEventListener('click', function() {
        var qId = parseInt(b.getAttribute('data-convert-invoice'));
        var q = null;
        for (var i = 0; i < DB.quotations.length; i++) { if (DB.quotations[i].id === qId) { q = DB.quotations[i]; break; } }
        if (!q) return;
        // Create invoice from quotation data
        var newInvoice = {
          id: Date.now(),
          date: q.date,
          invoiceNo: generateInvoiceNo(),
          customer: q.customer || '',
          note: q.note || '',
          status: 'Draft',
          items: (q.items || []).map(function(it) { return { product: it.product, category: it.category, brand: it.brand, model: it.model, serial: it.serial, qty: it.qty, price: it.price, total: it.total, remarks: it.remarks }; }),
          total: q.total || 0
        };
        DB.invoices.push(newInvoice);
        showToast('Sell Proposal converted to Invoice: ' + newInvoice.invoiceNo);
        navigate('invoice-list');
      });
    })(convertBtns[c]);
  }
}

function generateQuoteNo() {
  var year = new Date().getFullYear();
  var prefix = 'QT-' + year + '-';
  var maxSeq = 0;
  for (var i = 0; i < DB.quotations.length; i++) {
    var qn = DB.quotations[i].quoteNo || '';
    if (qn.indexOf(prefix) === 0) { var num = parseInt(qn.substring(prefix.length), 10); if (!isNaN(num) && num > maxSeq) maxSeq = num; }
  }
  var seq = '' + (maxSeq + 1); while (seq.length < 3) seq = '0' + seq;
  return prefix + seq;
}

  for (var k = 0; k < DB.products.length; k++) {

    for (var j = 0; j < DB.purchases.length; j++) { if (DB.purchases[j].status === 'Approved' && DB.purchases[j].product === p.name) pur += (DB.purchases[j].qty || 0); }
    for (var j = 0; j < DB.deliveries.length; j++) { if (DB.deliveries[j].product === p.name && DB.deliveries[j].status === 'Approved') del += (DB.deliveries[j].qty || 0); }
    for (var j = 0; j < DB.damages.length; j++) { if (DB.damages[j].product === p.name) dmg += (DB.damages[j].qty || 0); }

      var customer = document.getElementById('f-quote-customer').value.trim();
      var subject = document.getElementById('f-quote-subject').value.trim();
      var note = document.getElementById('f-quote-note').value.trim();
      var status = document.getElementById('f-quote-status').value;
      var rows2 = document.querySelectorAll('#pur-entries-body tr');

      for (var si2 = 0; si2 < rows2.length; si2++) {
        var r = rows2[si2];
        var product = r.querySelector('[data-f="product"]').value;

        var qty = parseFloat(r.querySelector('[data-f="qty"]').value) || 0;
        var price = parseFloat(r.querySelector('[data-f="price"]').value) || 0;
        var total = qty * price;
        grandTotal += total;

      }
      if (items.length === 0) { showToast('Add at least one product', 'error'); return; }
      if (q) {
        q.date = date; q.quoteNo = quoteNo; q.customer = customer; q.subject = subject; q.note = note; q.status = status;

        DB.quotations.push({ id: Date.now(), date: date, quoteNo: quoteNo, customer: customer, subject: subject, note: note, status: status, items: items, total: grandTotal });
        closeModal(); showToast('Sell Proposal added'); renderPage(); saveDBNow(null, { skipMerge: true });

function quotationTableRowHTML(catOpts, brandOpts, prdArr) {

  h += '<td class="pur-td"><select data-f="brand">' + brandOpts + '</select></td>';
  h += '<td class="pur-td"><input data-f="model" placeholder="Model" style="background:#f5f7f5;color:var(--muted);" readonly></td>';
  h += '<td class="pur-td"><input data-f="serial" placeholder="Serial Number" style="background:#f5f7f5;color:var(--muted);" readonly></td>';

function generateInvoiceNo() {
  var year = new Date().getFullYear();
  var prefix = 'INV-' + year + '-';
  var maxSeq = 0;
  for (var i = 0; i < DB.invoices.length; i++) {
    var ino = DB.invoices[i].invoiceNo || '';
    if (ino.indexOf(prefix) === 0) { var num = parseInt(ino.substring(prefix.length), 10); if (!isNaN(num) && num > maxSeq) maxSeq = num; }
  }
  var seq = '' + (maxSeq + 1); while (seq.length < 3) seq = '0' + seq;
  return prefix + seq;
}

function openInvoiceModal(invId, readOnly) {

    var p = DB.products[k];
    var pur = 0, del = 0, dmg = 0, adj2 = 0;
    for (var j = 0; j < DB.purchases.length; j++) { if (DB.purchases[j].status === 'Approved' && DB.purchases[j].product === p.name) pur += (DB.purchases[j].qty || 0); }

function generateDamageRef() {
  var year = new Date().getFullYear();
  var prefix = 'DMG-' + year + '-';
  var maxSeq = 0;
  for (var i = 0; i < DB.damages.length; i++) {
    var r = DB.damages[i].ref || '';
    if (r.indexOf(prefix) === 0) { var n = parseInt(r.substring(prefix.length), 10); if (!isNaN(n) && n > maxSeq) maxSeq = n; }
  }
  var seq = '' + (maxSeq + 1); while (seq.length < 3) seq = '0' + seq;
  return prefix + seq;
}

function generateTransferRef() {
  var year = new Date().getFullYear();
  var prefix = 'TRF-' + year + '-';
  var maxSeq = 0;
  for (var i = 0; i < DB.transfers.length; i++) {
    var r = DB.transfers[i].ref || '';
    if (r.indexOf(prefix) === 0) { var n = parseInt(r.substring(prefix.length), 10); if (!isNaN(n) && n > maxSeq) maxSeq = n; }
  }
  var seq = '' + (maxSeq + 1); while (seq.length < 3) seq = '0' + seq;
  return prefix + seq;
}

        DB.transfers.push({ id: Date.now(), ref: ref, date: date, product: product, qty: qty, fromBranch: fromBranch, toBranch: toBranch, status: status });

      }
    });
  }
}

    html += '</div>';

    // Bottom bar: Status + Cancel/Save
    html += '<div style="display:flex;align-items:center;gap:14px;padding-top:4px;">';
    html += '<div style="display:flex;align-items:center;gap:10px;">';
    html += '<span style="font-size:13px;font-weight:600;color:var(--muted);">Status:</span>';
    html += '<select class="form-input" id="f-pur-status" style="width:160px;border-radius:8px;"><option value="Draft">Draft</option><option value="Confirm">Confirm</option></select>';
    html += '</div>';
    html += '<div style="flex:1;"></div>';
    html += '<button class="btn btn-secondary" onclick="closeModal()" style="border-radius:8px;">Cancel</button>';
    html += '<button class="btn btn-primary" id="btn-save-pur" style="border-radius:8px;"><i class="fas fa-check"></i> Save</button>';
    html += '</div></div></div>';

    injectPurStyles();

    box.innerHTML = html;
    box.style.width = 'auto';
    box.style.maxWidth = '96vw';
    overlay.classList.add('show');

    bindPurRowDel(document.querySelector('#pur-entries-body tr'));
    bindAllPurSearchable(box, purProductSelectCb);

    document.getElementById('btn-pur-addrow').addEventListener('click', function() {
      var tbody = document.getElementById('pur-entries-body');
      var tr = document.createElement('tr');
      tr.innerHTML = purTableRowHTML(catOpts, brandOpts, prdOpts, prdArr);
      tbody.appendChild(tr);
      bindPurRowDel(tr);
      bindAllPurSearchable(tr, purProductSelectCb);
    });

    document.getElementById('btn-save-pur').addEventListener('click', function() {
      var date = document.querySelector('[data-top="date"]').value;
      var invoice = document.querySelector('[data-top="invoice"]').value.trim();
      var supplier = document.querySelector('[data-top="supplier"]').value;
      // Mandatory top fields
      if (!date) { showToast('Date is required', 'error'); return; }
      if (!invoice) { showToast('Invoice No is required', 'error'); return; }
      if (!supplier) { showToast('Supplier is required', 'error'); return; }
      var status = document.getElementById('f-pur-status').value;
      var rows = document.querySelectorAll('#pur-entries-body tr');
      var hasItem = false;
      for (var i = 0; i < rows.length; i++) {
        var p = rows[i].querySelector('[data-f="product"]');
        if (p && p.value) { hasItem = true; break; }
      }
      if (!hasItem) { showToast('Add at least one product', 'error'); return; }
      // Mandatory row fields: Brand, Model, Serial Number, Condition, Warranty, Quantity, Price
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var prod = r.querySelector('[data-f="product"]').value;
        if (!prod) continue;  // skip empty rows
        var brand = r.querySelector('[data-f="brand"]').value;
        var model = r.querySelector('[data-f="model"]').value;
        var serial = r.querySelector('[data-f="serial"]').value;
        var cond = r.querySelector('[data-f="condition"]').value;
        var war = r.querySelector('[data-f="warranty"]').value;
        var qty = parseFloat(r.querySelector('[data-f="qty"]').value) || 0;
        var price = parseFloat(r.querySelector('[data-f="price"]').value) || 0;
        if (!brand) { showToast('Brand is required for product: ' + prod, 'error'); return; }
        if (!model) { showToast('Model is required for product: ' + prod, 'error'); return; }
        if (!serial) { showToast('Serial Number is required for product: ' + prod, 'error'); return; }
        if (!cond) { showToast('Condition is required for product: ' + prod, 'error'); return; }
        if (!war) { showToast('Warranty is required for product: ' + prod, 'error'); return; }
        if (!qty || qty <= 0) { showToast('Quantity must be greater than 0 for product: ' + prod, 'error'); return; }
        if (!price || price <= 0) { showToast('Price must be greater than 0 for product: ' + prod, 'error'); return; }
      }
      var attachInput = document.querySelector('[data-top="attach"]');
      var attachInfo = null;
      if (attachInput && attachInput.files && attachInput.files.length > 0) {
        var f = attachInput.files[0];
        // Limit to 1 MB to stay within Vercel's 4.5MB serverless body limit.
        // Base64 encoding adds ~33% overhead, so a 1MB file becomes ~1.3MB base64.
        // Combined with the rest of the DB JSON, total POST body stays under 4.5MB.
        if (f.size > 1 * 1024 * 1024) {
          showToast('Attachment too large (max 1 MB). Use a smaller file or compress it.', 'error');
          return;
        }
        // Show "saving..." feedback so the user knows we're reading the file
        showToast('Reading attachment...', 'info');
        readFileAsDataURL(f).then(function(dataUrl) {
          attachInfo = { name: f.name, type: f.type || 'File', size: (f.size / 1024).toFixed(1) + ' KB', data: dataUrl };
          savePurchaseRows();
        }).catch(function(err) {
          showToast('Could not read attachment: ' + err.message, 'error');
          // Still save the purchase without the attachment
          savePurchaseRows();
        });
      } else {
        savePurchaseRows();
      }

      function savePurchaseRows() {
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var product = r.querySelector('[data-f="product"]').value;
        if (!product) continue;
        var category = r.querySelector('[data-f="category"]').value;
        var qty = parseFloat(r.querySelector('[data-f="qty"]').value) || 0;
        var price = parseFloat(r.querySelector('[data-f="price"]').value) || 0;
        var uom = r.querySelector('[data-f="uom"]') ? r.querySelector('[data-f="uom"]').value : '';
        // Attach the file data ONLY on the first row of the invoice (so we don't duplicate large base64 blobs)
        var rowAttach = (i === 0) ? attachInfo : null;
        DB.purchases.push({
          id: Date.now() + i, invoice: invoice, date: date, supplier: supplier,
          product: product, category: category, qty: qty, unitPrice: price, total: qty * price,
          status: status, branch: 'Head Office', attachment: rowAttach,
          brand: r.querySelector('[data-f="brand"]').value,
          model: r.querySelector('[data-f="model"]').value,
          serial: r.querySelector('[data-f="serial"]').value,
          condition: r.querySelector('[data-f="condition"]').value,
          warranty: r.querySelector('[data-f="warranty"]').value,
          uom: uom,
          remarks: r.querySelector('[data-f="remarks"]').value
        });
      }
      closeModal(); renderPage();
      // If there's an attachment, save IMMEDIATELY (no debounce) and wait
      // for the server response before showing success/failure. Without
      // this, the debounced save might fail silently on large payloads.
      // Use skipMerge: true to avoid the GET-merge-POST doubling the data
      // transfer, which causes "Network unexpected" errors on large attachments.
      if (attachInfo) {
        showToast('Saving purchase with attachment...', 'info');
        saveDBNow(function(res) {
          if (res && res.ok) {
            showToast('Purchase saved successfully (with attachment)');
          } else {
            showToast('Purchase saved locally but server save failed. The attachment may not be persisted. Please try again or use a smaller file.', 'error');
          }
        }, { skipMerge: true });
      } else {

          var iconClass = isImage ? 'fa-image' : (isPdf ? 'fa-file-pdf' : 'fa-file-alt');
          html += '<div style="border:1px solid var(--border);border-radius:12px;padding:20px;display:flex;align-items:center;gap:16px;margin-bottom:16px;">';
          html += '<div style="width:48px;height:48px;border-radius:10px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fas ' + iconClass + '" style="color:var(--accent);font-size:20px;"></i></div>';
          html += '<div style="flex:1;min-width:0;"><div style="font-weight:600;font-size:14px;word-break:break-all;">' + attach.name + '</div><div style="font-size:12px;color:var(--muted);">' + (attach.type || 'File') + ' &middot; ' + (attach.size || '') + '</div></div>';
          html += '</div>';
          // Inline thumbnail for images
          if (isImage && attach.data) {
            html += '<div style="border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px;text-align:center;background:#f6f8f6;"><img src="' + attach.data + '" style="max-width:100%;max-height:300px;object-fit:contain;display:block;margin:0 auto;"></div>';
          }
          // Action buttons — Preview + Download (only if file content is stored)
          html += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;">';
          if (attach.data) {
            // Store attach globally and reference it by index, to avoid escaping issues
            window._currentAttachView = attach;
            html += '<button class="btn btn-primary" onclick="previewAttachment(window._currentAttachView)"><i class="fas fa-eye"></i> View</button>';
            html += '<button class="btn btn-secondary" onclick="downloadAttachment(window._currentAttachView)"><i class="fas fa-download"></i> Download</button>';
          } else {
            // Older purchase — metadata only. Offer a "Re-upload File" button so the user
            // can recover the missing content right from this view modal.
            window._reuploadContext = { type: 'purchase', invoice: pur.invoice, attachName: attach.name, attachType: attach.type, attachSize: attach.size };
            html += '<div style="font-size:12px;color:var(--warning);padding:10px 12px;background:rgba(217,119,6,0.08);border:1px solid rgba(217,119,6,0.30);border-radius:8px;margin-bottom:8px;">';
            html += '<i class="fas fa-exclamation-triangle"></i> <strong>File content is missing.</strong> This purchase was saved before the attachment fix. Re-upload the file to enable View + Download.';
            html += '</div>';
            html += '<input type="file" id="reupload-purchase-file" style="display:none;" onchange="reuploadAttachment(\'purchase\')">';
            html += '<button class="btn btn-primary" onclick="document.getElementById(\'reupload-purchase-file\').click()"><i class="fas fa-upload"></i> Re-upload File</button>';
          }
          html += '</div>';
        } else {
          html += '<div style="text-align:center;padding:40px 0;">';
          html += '<div style="width:64px;height:64px;border-radius:16px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;"><i class="fas fa-file-upload" style="color:var(--accent);font-size:24px;"></i></div>';
          html += '<div style="font-size:15px;font-weight:600;color:var(--fg);margin-bottom:6px;">No Attachment Found</div>';
          html += '<div style="font-size:13px;color:var(--muted);">This purchase has no attached file.</div>';
          html += '</div>';
        }
        html += '</div><div style="display:flex;gap:12px;justify-content:flex-end;margin-top:16px;"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div></div>';
        openModal(html);
      });
    })(attachIcons[a]);
  }
}

function purSearchableHTML(name, dataAttr, options, selectedValue, placeholder, searchPlaceholder) {
  var sel = null;
  for (var i = 0; i < options.length; i++) { if (options[i].value === selectedValue) { sel = options[i]; break; } }
  var display = sel ? sel.label : '<span style="color:var(--muted);">' + (placeholder || 'Select') + '</span>';
  var h = '<div class="pur-sr" data-sr="' + name + '">';
  h += '<input type="hidden" ' + dataAttr + ' value="' + (selectedValue || '') + '">';
  h += '<button type="button" class="pur-sr-trigger">' + display + '<i class="fas fa-chevron-down pur-sr-caret"></i></button>';
  h += '<div class="pur-sr-panel" style="display:none;">';
  h += '<div class="pur-sr-search"><i class="fas fa-search"></i><input type="text" class="pur-sr-search-input" placeholder="' + (searchPlaceholder || 'Search...') + '"></div>';
  h += '<div class="pur-sr-options">';
  if (options.length === 0) {
    h += '<div class="pur-sr-empty">No options</div>';
  } else {
    // Whitelist of extra data attributes we support on options (in addition to value/label/category)
    var extraAttrs = ['brand', 'model', 'serial', 'condition', 'warranty', 'empId', 'department', 'branch', 'stock'];
    for (var i = 0; i < options.length; i++) {
      var v = (options[i].value || '').toString().replace(/"/g, '&quot;');
      var l = (options[i].label || '').toString();
      var ls = l.toLowerCase().replace(/"/g, '&quot;');
      var c = (options[i].category || '').toString().replace(/"/g, '&quot;');
      // Also include serial in the searchable label so users can search by serial
      var serialStr = (options[i].serial || '').toString();
      var searchStr = ls + (serialStr ? ' ' + serialStr.toLowerCase().replace(/"/g, '&quot;') : '');
      h += '<div class="pur-sr-option' + (options[i].value === selectedValue ? ' selected' : '') + '" data-value="' + v + '" data-label="' + searchStr + '" data-category="' + c + '"';
      // Add extra data attributes
      for (var ea = 0; ea < extraAttrs.length; ea++) {
        var attrName = extraAttrs[ea];
        if (options[i][attrName] !== undefined && options[i][attrName] !== null && options[i][attrName] !== '') {
          h += ' data-' + attrName + '="' + options[i][attrName].toString().replace(/"/g, '&quot;') + '"';
        }
      }
      h += '>' + l + '</div>';
    }
  }
  h += '</div></div></div>';
  return h;
}

function closeAllPurPanels() {
  var panels = document.querySelectorAll('.pur-sr-panel');
  for (var i = 0; i < panels.length; i++) panels[i].style.display = 'none';

function cleanupPurPanels() {
  var panels = document.querySelectorAll('body > .pur-sr-panel');
  for (var i = 0; i < panels.length; i++) panels[i].remove();
}

function positionPurPanel(trigger, panel) {
  var rect = trigger.getBoundingClientRect();
  var panelWidth = Math.max(rect.width, 220);
  var top = rect.bottom + 2;
  var left = rect.left;
  // If not enough space below, open above
  var spaceBelow = window.innerHeight - rect.bottom;
  if (spaceBelow < 280 && rect.top > 280) { top = rect.top - 280 - 2; }
  // If panel would go off right edge, shift left
  if (left + panelWidth > window.innerWidth - 8) { left = window.innerWidth - panelWidth - 8; }
  if (left < 8) left = 8;
  panel.style.top = top + 'px';
  panel.style.left = left + 'px';
  panel.style.width = panelWidth + 'px';
}

function bindPurSearchable(wrapper, onSelectCallback) {
  if (!wrapper || wrapper.dataset.srBound === '1') return;
  wrapper.dataset.srBound = '1';
  var trigger = wrapper.querySelector('.pur-sr-trigger');
  var panel = wrapper.querySelector('.pur-sr-panel');
  var search = wrapper.querySelector('.pur-sr-search-input');
  var hidden = wrapper.querySelector('input[type="hidden"]');
  var options = wrapper.querySelectorAll('.pur-sr-option');
  if (!trigger || !panel) return;

  // Detach panel to body so it isn't clipped by overflow containers
  document.body.appendChild(panel);

  trigger.addEventListener('click', function(e) {
    e.stopPropagation();
    var isOpen = panel.style.display === 'flex';
    closeAllPurPanels();
    if (isOpen) return;
    positionPurPanel(trigger, panel);
    panel.style.display = 'flex';
    if (search) { search.value = ''; for (var i = 0; i < options.length; i++) options[i].style.display = 'block'; }
    setTimeout(function() { if (search) search.focus(); }, 30);
  });

  if (search) {
    search.addEventListener('input', function() {
      var q = search.value.toLowerCase();
      for (var i = 0; i < options.length; i++) {
        var label = options[i].getAttribute('data-label') || '';
        options[i].style.display = label.indexOf(q) !== -1 ? 'block' : 'none';
      }
    });
    search.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') { panel.style.display = 'none'; trigger.focus(); }
    });
  }

  for (var i = 0; i < options.length; i++) {
    (function(opt) {
      opt.addEventListener('click', function(e) {
        e.stopPropagation();
        var val = opt.getAttribute('data-value');
        var lbl = opt.textContent;
        var cat = opt.getAttribute('data-category') || '';
        // Build a full option data object from all data-* attributes
        var optData = { value: val, label: lbl, category: cat };
        var extraKeys = ['brand', 'model', 'serial', 'condition', 'warranty', 'empId', 'department', 'branch', 'stock'];
        for (var ek = 0; ek < extraKeys.length; ek++) {
          var av = opt.getAttribute('data-' + extraKeys[ek]);
          if (av !== null) optData[extraKeys[ek]] = av;
        }
        hidden.value = val;
        trigger.innerHTML = lbl + '<i class="fas fa-chevron-down pur-sr-caret"></i>';
        for (var j = 0; j < options.length; j++) options[j].classList.remove('selected');
        opt.classList.add('selected');
        panel.style.display = 'none';
        if (onSelectCallback) onSelectCallback(val, lbl, cat, wrapper, optData);
      });
    })(options[i]);
  }
}

function bindAllPurSearchable(scope, onSelectCallback) {
  var wrappers = (scope || document).querySelectorAll('.pur-sr');
  for (var i = 0; i < wrappers.length; i++) bindPurSearchable(wrappers[i], onSelectCallback);
}

function setPurSearchableValue(wrapper, value, label) {
  if (!wrapper) return;
  var hidden = wrapper.querySelector('input[type="hidden"]');
  var trigger = wrapper.querySelector('.pur-sr-trigger');
  if (!hidden || !trigger) return;
  hidden.value = value || '';
  if (value) {
    trigger.innerHTML = label + '<i class="fas fa-chevron-down pur-sr-caret"></i>';
    var options = wrapper.querySelectorAll('.pur-sr-option');
    for (var i = 0; i < options.length; i++) {
      if (options[i].getAttribute('data-value') === value) options[i].classList.add('selected');
      else options[i].classList.remove('selected');
    }
  }
}

function bindCashInEvents() {
  var btn = document.getElementById('btn-add-cashin');
  if (!btn) return;
  btn.addEventListener('click', function() {
    var html = '<div style="padding:24px;">' + modalHeader('Add Cash In') + '<div style="padding-top:16px;">';
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;"><div class="form-group"><label class="form-label">Date</label><input class="form-input" id="f-ci-date" type="date"></div>';
    html += '<div class="form-group"><label class="form-label">Amount</label><input class="form-input" id="f-ci-amount" type="number"></div></div>';
    html += '<div class="form-group"><label class="form-label">Description</label><input class="form-input" id="f-ci-desc"></div>';
    html += '<div class="form-group"><label class="form-label">Attach File</label><input type="file" class="form-input" id="f-ci-attach" style="padding:6px 12px;"></div>';
    html += '<div class="form-group"><label class="form-label">Status</label><select class="form-input" id="f-ci-status"><option>Pending</option><option>Approved</option><option>Rejected</option></select></div>';
    html += '</div><div style="padding:0 0 20px;display:flex;gap:12px;justify-content:flex-end;"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button>';
    html += '<button class="btn btn-primary" id="btn-save-ci"><i class="fas fa-save"></i> Save</button></div></div>';
    openModal(html);
    document.getElementById('btn-save-ci').addEventListener('click', function() {
      var amount = Number(document.getElementById('f-ci-amount').value);
      if (!amount) { showToast('Amount required', 'error'); return; }
      var attachInput = document.getElementById('f-ci-attach');
      var attachInfo = null;
      if (attachInput && attachInput.files && attachInput.files.length > 0) {
        var f = attachInput.files[0];
        if (f.size > 5 * 1024 * 1024) { showToast('Attachment too large (max 5 MB)', 'error'); return; }
        showToast('Reading attachment...', 'info');
        readFileAsDataURL(f).then(function(dataUrl) {
          attachInfo = { name: f.name, type: f.type || 'File', size: (f.size / 1024).toFixed(1) + ' KB', data: dataUrl };
          saveCashIn();
        }).catch(function(err) {
          showToast('Could not read attachment: ' + err.message, 'error');
          saveCashIn();
        });
      } else {
        saveCashIn();
      }
      function saveCashIn() {
        DB.cashIn.push({
          id: Date.now(),
          voucher: 'CI-' + Date.now(),
          date: document.getElementById('f-ci-date').value,
          amount: amount,
          description: document.getElementById('f-ci-desc').value.trim(),
          status: document.getElementById('f-ci-status').value,
          attachment: attachInfo
        });
        closeModal(); showToast('Cash In added'); renderPage(); saveDBNow(null, { skipMerge: true });
      }
    });
  });

  // Attachment preview
  var attachIcons = document.querySelectorAll('[data-attach-ci]');
  for (var a = 0; a < attachIcons.length; a++) {
    (function(icon) {
      icon.addEventListener('click', function() {
        var ciId = parseInt(icon.getAttribute('data-attach-ci'));
        var ci = null;
        for (var j = 0; j < DB.cashIn.length; j++) { if (DB.cashIn[j].id === ciId) { ci = DB.cashIn[j]; break; } }

// ==================== APPROVAL PAGES ====================
function renderApprovalList(type, data) {
  // Approval pipeline:
  // - Confirm: user confirmed the purchase — Approve Request has been sent, awaiting approval
  // - Submitted / Pending: legacy statuses — also shown as pending approval
  // - Approved / Rejected: shown as already-decided rows
  // - Draft: NOT shown here — Draft purchases are still being edited by the user
  //
  // For PURCHASE type: group all rows that share the same invoice into ONE
  // display row. Approve/Reject/Edit/Delete operate on the whole invoice.
  // For other types (delivery, adjustment, damage): each record stays its own row.
  var pendingStatuses = ['Confirm', 'Submitted', 'Pending'];

  // Build the list of items to render. For purchase, this is a list of
  // invoice groups; for other types, it's the raw records.
  var renderItems = [];
  if (type === 'purchase') {
    // Group rows by invoice — preserve insertion order (first-seen wins).
    var invoiceGroups = {};  // invoice -> { invoice, date, supplier, branch, status, items: [...], total, ids: [...] }
    var invoiceOrder = [];
    for (var i = 0; i < data.length; i++) {
      var p = data[i];
      var key = p.invoice || ('__no_invoice_' + p.id);
      if (!invoiceGroups[key]) {
        invoiceGroups[key] = {
          invoice: p.invoice,
          date: p.date,
          supplier: p.supplier,
          branch: p.branch,
          // Pick the most "advanced" status of the group (Approved > Rejected > Confirm/Submitted/Pending > Draft).
          // For approval display purposes we want to reflect the most recent decision.
          status: p.status,
          items: [],
          total: 0,
          ids: []
        };
        invoiceOrder.push(key);
      }
      invoiceGroups[key].items.push(p);
      invoiceGroups[key].total += (p.total || 0);
      invoiceGroups[key].ids.push(p.id);
      // Pick the "highest" status — Approved wins over Rejected, which wins over pending, which wins over Draft.
      var s = p.status;
      var g = invoiceGroups[key];
      var rank = function(st) {
        if (st === 'Approved') return 4;
        if (st === 'Rejected') return 3;
        if (st === 'Confirm' || st === 'Submitted' || st === 'Pending') return 2;
        return 1; // Draft
      };
      if (rank(s) > rank(g.status)) g.status = s;
    }
    renderItems = invoiceOrder.map(function(k) { return invoiceGroups[k]; });
  } else {
    renderItems = data.slice();
  }

  // Counts for the top stats — count by display item (group) for purchase, by record for others
  var pending = renderItems.filter(function(d){ return pendingStatuses.indexOf(d.status) !== -1; });
  var approved = renderItems.filter(function(d){ return d.status === 'Approved'; });
  var rejected = renderItems.filter(function(d){ return d.status === 'Rejected'; });
  var draft = renderItems.filter(function(d){ return d.status === 'Draft'; });
  var cols, labels = { purchase: 'Purchase', delivery: 'Delivery', adjustment: 'Adjustment', damage: 'Damage' };
  if (type === 'purchase') cols = ['Invoice', 'Date', 'Supplier', 'Items', 'Amount', 'Branch', 'Status'];
  else if (type === 'delivery') cols = ['Chalan', 'Date', 'Product', 'Qty', 'Branch', 'Received By', 'Status'];
  else if (type === 'adjustment') cols = ['Reference', 'Date', 'Product', 'Branch', 'Type', 'Qty', 'Status'];
  else cols = ['Reference', 'Date', 'Product', 'Branch', 'Qty', 'Reason', 'Status'];

  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">';
  html += '<div style="font-size:20px;font-weight:800;">' + labels[type] + ' Approval</div>';
  html += '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;">';
  if (type === 'purchase') {
    html += '<div style="display:flex;align-items:center;gap:6px;font-size:13px;"><div class="pulse-dot" style="background:var(--muted);"></div><span style="font-weight:600;">' + draft.length + ' Draft</span></div>';
  }
  html += '<div style="display:flex;align-items:center;gap:6px;font-size:13px;"><div class="pulse-dot" style="background:var(--warning);"></div><span style="font-weight:600;">' + pending.length + ' Pending</span></div>';
  html += '<div style="display:flex;align-items:center;gap:6px;font-size:13px;"><div class="pulse-dot" style="background:var(--accent);"></div><span style="font-weight:600;">' + approved.length + ' Approved</span></div>';
  html += '<div style="display:flex;align-items:center;gap:6px;font-size:13px;"><div class="pulse-dot" style="background:var(--danger);"></div><span style="font-weight:600;">' + rejected.length + ' Rejected</span></div>';
  html += '</div></div>';
  html += '<div class="stat-card" style="padding:0;overflow:hidden;"><div style="overflow-x:auto;max-height:calc(100vh - 220px);overflow-y:auto;">';
  html += '<table class="data-table" id="main-table"><thead><tr>';
  for (var c = 0; c < cols.length; c++) html += '<th>' + cols[c] + '</th>';
  html += '<th style="width:240px;">Actions</th></tr></thead><tbody>';
  for (var i = 0; i < renderItems.length; i++) {
    var item = renderItems[i];
    // Skip Draft purchases — they belong only to Purchase List, not Approval
    if (item.status === 'Draft') continue;
    html += '<tr>';
    if (type === 'purchase') {
      // item is a group: { invoice, date, supplier, branch, status, items: [...], total, ids: [...] }
      // Items column: show count, e.g. "3 items" (or the single product name if only 1)
      var itemsLabel = item.items.length > 1
        ? '<span style="font-weight:600;color:var(--accent);">' + item.items.length + ' items</span> <span style="font-size:11px;color:var(--muted);">(' + fmt(item.total) + ')</span>'
        : (item.items[0].product || '-');
      html += '<td style="font-weight:600;">' + (item.invoice || '-') + '</td><td>' + (item.date || '-') + '</td><td>' + (item.supplier || '-') + '</td><td>' + itemsLabel + '</td><td style="font-weight:600;">' + fmt(item.total) + '</td><td>' + (item.branch || '-') + '</td>';
    }
    else if (type === 'delivery') html += '<td style="font-weight:600;">' + item.chalan + '</td><td>' + item.date + '</td><td>' + item.product + '</td><td style="text-align:center;">' + item.qty + '</td><td>' + item.branch + '</td><td>' + item.receivedBy + '</td>';
    else if (type === 'adjustment') html += '<td style="font-weight:600;">' + item.ref + '</td><td>' + item.date + '</td><td>' + item.product + '</td><td>' + item.branch + '</td><td><span class="badge ' + (item.type==='Increase'?'badge-green':'badge-red') + '">' + item.type + '</span></td><td style="text-align:center;">' + item.qty + '</td>';
    else html += '<td style="font-weight:600;">' + item.ref + '</td><td>' + item.date + '</td><td>' + item.product + '</td><td>' + item.branch + '</td><td style="text-align:center;">' + item.qty + '</td><td>' + item.reason + '</td>';

    // Status cell (7th column)
    html += '<td>' + statusBadge(item.status) + '</td>';

    // Actions cell — View + Approve + Edit + Delete for all statuses
    // For purchase (grouped), the action button's data-* attribute stores the
    // FIRST id of the invoice group. Click handlers were updated to operate
    // on all rows with the same invoice when the type is 'purchase'.
    var actionId = (type === 'purchase') ? item.ids[0] : item.id;
    var actionInvoice = (type === 'purchase') ? (item.invoice || '') : '';
    html += '<td style="white-space:nowrap;">';
    // View button (always shown)
    html += '<button class="btn btn-secondary btn-sm btn-icon" data-approve-view="' + type + '-' + actionId + '" title="View" style="color:var(--accent);"><i class="fas fa-eye" style="font-size:11px;"></i></button> ';
    // Approve button (shown for pending/submitted only)
    if (pendingStatuses.indexOf(item.status) !== -1) {
      html += '<button class="btn btn-primary btn-sm btn-icon" data-approve="' + type + '-' + actionId + '" data-invoice="' + actionInvoice + '" title="Approve" style="background:var(--accent);border-color:var(--accent);"><i class="fas fa-check" style="font-size:11px;"></i></button> ';
    }
    // Edit button (shown for pending/submitted only — Approved rows can't be edited)
    if (pendingStatuses.indexOf(item.status) !== -1) {
      var editTarget = (type === 'purchase') ? 'pur' : (type === 'delivery' ? 'del' : (type === 'adjustment' ? 'adj' : 'dmg'));
      html += '<button class="btn btn-secondary btn-sm btn-icon" data-approve-edit-' + editTarget + '="' + actionId + '" title="Edit"><i class="fas fa-pen" style="font-size:11px;"></i></button> ';
    }
    // Delete button (always shown — Draft excluded above so this is for pending/approved/rejected)
    html += '<button class="btn btn-secondary btn-sm btn-icon" data-approve-del-' + type + '="' + actionId + '" data-invoice="' + actionInvoice + '" title="Delete" style="color:var(--danger);"><i class="fas fa-trash" style="font-size:11px;"></i></button>';
    html += '</td>';
    html += '</tr>';
  }
  html += '</tbody></table></div></div>';
  return html;
}

function bindApprovalEvents() {
  var approveBtns = document.querySelectorAll('[data-approve]');
  for (var i = 0; i < approveBtns.length; i++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        // Defense-in-depth: Approve counts as 'edit' on the current submenu
        if (!can(currentPage, 'edit')) {
          showToast('Access denied — you do not have approve permission for ' + currentPage, 'error');
          return;
        }
        var parts = btn.getAttribute('data-approve').split('-');
        var type = parts[0], id = parseInt(parts.slice(1).join('-'));
        var invoice = btn.getAttribute('data-invoice') || '';
        var map = { purchase: 'purchases', delivery: 'deliveries', adjustment: 'adjustments', damage: 'damages' };
        if (type === 'purchase' && invoice) {
          // Approve ALL rows with this invoice (the approval is at the invoice level)
          var updatedCount = 0;
          for (var k = 0; k < DB.purchases.length; k++) {
            if (DB.purchases[k].invoice === invoice) {
              DB.purchases[k].status = 'Approved';
              updatedCount++;
            }
          }
          showToast('Invoice ' + invoice + ' approved (' + updatedCount + ' item' + (updatedCount === 1 ? '' : 's') + ')');
          renderPage();
          saveDBNow(); // Save immediately — don't wait for debounce
        } else {
          var item = DB[map[type]].find(function(x){ return x.id === id; });
          if (item) { item.status = 'Approved'; showToast('Approved successfully'); renderPage(); saveDBNow(); }
        }
      });
    })(approveBtns[i]);
  }
  var rejectBtns = document.querySelectorAll('[data-reject]');
  for (var j = 0; j < rejectBtns.length; j++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        // Defense-in-depth: Reject also counts as 'edit' on the current submenu
        if (!can(currentPage, 'edit')) {
          showToast('Access denied — you do not have reject permission for ' + currentPage, 'error');
          return;
        }
        var parts = btn.getAttribute('data-reject').split('-');
        var type = parts[0], id = parseInt(parts.slice(1).join('-'));
        var invoice = btn.getAttribute('data-invoice') || '';
        var map = { purchase: 'purchases', delivery: 'deliveries', adjustment: 'adjustments', damage: 'damages' };
        if (type === 'purchase' && invoice) {
          // Reject ALL rows with this invoice (the rejection is at the invoice level)
          var updatedCount = 0;
          for (var k = 0; k < DB.purchases.length; k++) {
            if (DB.purchases[k].invoice === invoice) {
              DB.purchases[k].status = 'Rejected';
              updatedCount++;
            }
          }
          showToast('Invoice ' + invoice + ' rejected (' + updatedCount + ' item' + (updatedCount === 1 ? '' : 's') + ')', 'error');
          renderPage();
        } else {
          var item = DB[map[type]].find(function(x){ return x.id === id; });
          if (item) { item.status = 'Rejected'; showToast('Rejected', 'error'); renderPage(); }
        }
      });
    })(rejectBtns[j]);
  }

  // ===== View buttons (open read-only modal) =====
  // For purchases and deliveries, we trigger a synthetic click on the matching
  // data-view-pur / data-view-del button that lives on the Purchase List /
  // Delivery List page — but those aren't visible here. So we render the view
  // modal directly inline.
  var viewBtns = document.querySelectorAll('[data-approve-view]');
  for (var v = 0; v < viewBtns.length; v++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        var parts = btn.getAttribute('data-approve-view').split('-');
        var type = parts[0], id = parseInt(parts.slice(1).join('-'));
        var map = { purchase: 'purchases', delivery: 'deliveries', adjustment: 'adjustments', damage: 'damages' };
        var item = DB[map[type]].find(function(x){ return x.id === id; });

            html += '<td class="pur-td" style="padding:9px 10px;font-size:13px;">' + (row.condition || '-') + '</td>';

          html += '<tr style="background:var(--accent-light);font-weight:700;"><td colspan="6" style="padding:10px;text-align:right;border-top:1px solid var(--border);">Grand Total (' + allRows.length + ' items):</td><td style="padding:10px;text-align:center;border-top:1px solid var(--border);border-right:1px solid var(--border);">' + totalQty + '</td><td style="border-top:1px solid var(--border);border-right:1px solid var(--border);"></td><td style="border-top:1px solid var(--border);border-right:1px solid var(--border);"></td><td style="padding:10px;text-align:right;border-top:1px solid var(--border);font-size:14px;color:var(--accent-dark);">' + fmt(grandTotal) + '</td></tr>';

      });
    })(viewBtns[v]);

  // ===== Edit buttons (open editable modal) =====

  var purEditBtns = document.querySelectorAll('[data-approve-edit-pur]');

        // We can't easily auto-open the edit modal from here without coupling.
        // Better: store the pending edit ID and let bindPurchaseEvents check it.
        window._pendingPurchaseEditId = id;
        // Wait for navigation then click edit
        setTimeout(function() {
          var editBtn = document.querySelector('[data-edit-pur="' + id + '"]');
          if (editBtn) editBtn.click();
          else showToast('Edit button not found — open from Purchase List', 'info');
        }, 500);
      });
    })(purEditBtns[pe]);
  }
  // Delivery edit
  var delEditBtns = document.querySelectorAll('[data-approve-edit-del]');
  for (var de = 0; de < delEditBtns.length; de++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        if (!can(currentPage, 'edit')) {
          showToast('Access denied — you do not have edit permission for ' + currentPage, 'error');
          return;
        }
        var id = parseInt(btn.getAttribute('data-approve-edit-del'));
        navigate('delivery-list');
        setTimeout(function() {
          var editBtn = document.querySelector('[data-edit-del="' + id + '"]');
          if (editBtn) editBtn.click();
          else showToast('Edit button not found — open from Delivery List', 'info');
        }, 500);
      });
    })(delEditBtns[de]);
  }
  // Adjustment edit
  var adjEditBtns = document.querySelectorAll('[data-approve-edit-adj]');
  for (var ae = 0; ae < adjEditBtns.length; ae++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        if (!can(currentPage, 'edit')) {
          showToast('Access denied — you do not have edit permission for ' + currentPage, 'error');
          return;
        }
        var id = parseInt(btn.getAttribute('data-approve-edit-adj'));
        navigate('adjustment-list');

          var editBtn = document.querySelector('[data-edit-adj="' + id + '"]');
          if (editBtn) editBtn.click();
          else showToast('Edit button not found — open from Adjustment List', 'info');
        }, 500);
      });
    })(adjEditBtns[ae]);
  }
  // Damage edit
  var dmgEditBtns = document.querySelectorAll('[data-approve-edit-dmg]');
  for (var dm = 0; dm < dmgEditBtns.length; dm++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        if (!can(currentPage, 'edit')) {
          showToast('Access denied — you do not have edit permission for ' + currentPage, 'error');
          return;
        }
        var id = parseInt(btn.getAttribute('data-approve-edit-dmg'));
        navigate('damage-list');

          if (editBtn) editBtn.click();

    })(dmgEditBtns[dm]);
  }

  // ===== Delete buttons =====
  // For purchase (grouped by invoice): delete ALL purchase rows with the same
  // invoice. For other types: delete the single record.
  var delSelectors = ['[data-approve-del-purchase]', '[data-approve-del-delivery]', '[data-approve-del-adjustment]', '[data-approve-del-damage]'];
  var delCollections = ['purchases', 'deliveries', 'adjustments', 'damages'];
  var delPages = ['approval-purchase', 'approval-delivery', 'approval-adjustment', 'approval-damage'];
  var delTypes = ['purchase', 'delivery', 'adjustment', 'damage'];
  for (var ds = 0; ds < delSelectors.length; ds++) {
    var delBtnList = document.querySelectorAll(delSelectors[ds]);
    for (var di = 0; di < delBtnList.length; di++) {
      (function(btn, collection, page, typeName) {
        btn.addEventListener('click', function() {
          // Defense-in-depth: check delete perm
          if (!can(page, 'delete')) {
            showToast('Access denied — you do not have delete permission for ' + page, 'error');
            return;
          }
          var id = parseInt(btn.getAttribute('data-approve-del-' + typeName));
          var invoice = btn.getAttribute('data-invoice') || '';
          if (typeName === 'purchase' && invoice) {
            // Delete ALL purchase rows with this invoice
            var matching = DB.purchases.filter(function(p){ return p.invoice === invoice; });
            var count = matching.length;
            if (count === 0) { showToast('No items found', 'error'); return; }
            if (!confirm('Delete invoice "' + invoice + '" with ' + count + ' item(s)? This cannot be undone.')) return;
            DB.purchases = DB.purchases.filter(function(p){ return p.invoice !== invoice; });
            closeModal();
            showToast('Invoice ' + invoice + ' deleted (' + count + ' items)');
            renderPage();
            // Use skipMerge: true — the GET-merge step would RE-ADD the deleted
            // purchase from the server. By skipping the merge, we POST the local
            // DB (which has the purchase removed) directly to the server.
            saveDBNow(null, { skipMerge: true });
          } else {
            // Single-record delete — use the standard deleteItem helper
            deleteItem(collection, id, page);
          }
        });
      })(delBtnList[di], delCollections[ds], delPages[ds], delTypes[ds]);
    }
  }
}

// Purchase Report filter functions
function filterPurchaseReport() {
  var dateFrom = (document.getElementById('filter-date-from') || {}).value || '';
  var dateTo = (document.getElementById('filter-date-to') || {}).value || '';
  var supEl = document.querySelector('[data-sr="filter-supplier"] input[type="hidden"]');
  var invEl = document.querySelector('[data-sr="filter-invoice"] input[type="hidden"]');
  var supplierFilter = supEl ? supEl.value : '';
  var invoiceFilter = invEl ? invEl.value : '';
  var rows = document.querySelectorAll('#main-table tbody tr');
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    // Skip grand total rows
    if (row.style.background && row.style.background.indexOf('accent') !== -1) continue;
    var cells = row.querySelectorAll('td');
    if (cells.length < 5) continue;
    // Purchase columns: #, Supplier, Date, Invoice, Product, ...
    var supplier = (cells[1] || {}).textContent || '';
    var date = (cells[2] || {}).textContent || '';
    var invoice = (cells[3] || {}).textContent || '';
    var matchDate = true;
    if (dateFrom && date < dateFrom) matchDate = false;
    if (dateTo && date > dateTo) matchDate = false;
    var matchSupplier = !supplierFilter || supplier.indexOf(supplierFilter) !== -1;
    var matchInvoice = !invoiceFilter || invoice.indexOf(invoiceFilter) !== -1;
    if (matchDate && matchSupplier && matchInvoice) {
      row.style.display = '';
    } else {
      row.style.display = 'none';
    }
  }
}

function clearPurchaseFilters() {
  var df = document.getElementById('filter-date-from'); if (df) df.value = '';
  var dt = document.getElementById('filter-date-to'); if (dt) dt.value = '';
  var sw = document.querySelector('[data-sr="filter-supplier"]');
  var iw = document.querySelector('[data-sr="filter-invoice"]');
  if (sw) { var st = sw.querySelector('.pur-sr-trigger'); if (st) st.innerHTML = '<span style="color:var(--muted);">All Suppliers</span><i class="fas fa-chevron-down pur-sr-caret"></i>'; var sh = sw.querySelector('input[type="hidden"]'); if (sh) sh.value = ''; }
  if (iw) { var it = iw.querySelector('.pur-sr-trigger'); if (it) it.innerHTML = '<span style="color:var(--muted);">All Invoices</span><i class="fas fa-chevron-down pur-sr-caret"></i>'; var ih = iw.querySelector('input[type="hidden"]'); if (ih) ih.value = ''; }
  filterPurchaseReport();
}

// Delivery Report filter functions
function filterDeliveryReport() {
  var branchFilter = '';
  var empFilter = '';
  var deptFilter = '';
  // Read from searchable dropdown hidden inputs
  var bh = document.querySelector('[data-sr="filter-branch"] input[type="hidden"]');
  var eh = document.querySelector('[data-sr="filter-emp"] input[type="hidden"]');
  var dh = document.querySelector('[data-sr="filter-dept"] input[type="hidden"]');
  if (bh) branchFilter = bh.value || '';
  if (eh) empFilter = eh.value || '';
  if (dh) deptFilter = dh.value || '';
  var rows = document.querySelectorAll('#main-table tbody tr');
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    // Skip grand total rows
    if (row.style.background && row.style.background.indexOf('accent') !== -1) continue;
    var cells = row.querySelectorAll('td');
    if (cells.length < 5) continue;
    // Delivery columns: #, Date, Branch, Employee Name, Employee ID, Department, ...
    var branch = (cells[2] || {}).textContent || '';
    var emp = (cells[3] || {}).textContent || '';
    var dept = (cells[5] || {}).textContent || '';
    var matchBranch = !branchFilter || branch.indexOf(branchFilter) !== -1;
    var matchEmp = !empFilter || emp.indexOf(empFilter) !== -1;
    var matchDept = !deptFilter || dept.indexOf(deptFilter) !== -1;
    if (matchBranch && matchEmp && matchDept) {
      row.style.display = '';
    } else {
      row.style.display = 'none';
    }
  }
}

  win.document.close();
  // Set onload BEFORE document.close() so the event fires correctly. Some
  // browsers fire onload synchronously after document.close(); if we set
  // onload AFTER document.close(), the event has already fired and the
  // handler never runs → print dialog never opens.
  win.onload = function() { setTimeout(function() { win.focus(); win.print(); }, 250); };
  // Fallback: also schedule a delayed print call in case onload doesn't fire
  // (e.g. popup opened but onload skipped). This is a no-op if onload already
  // triggered the print.
  setTimeout(function() {
    try {
      if (win && !win.closed) {
        win.focus();
        // Only call print if the document is fully written
        win.print();
      }
    } catch(e) {
      console.warn('Fallback print failed (this is OK if onload already printed):', e);
    }
  }, 800);
}

      html += '<td style="text-align:right;font-weight:700;color:' + (isCashIn ? 'var(--accent)' : 'var(--danger)') + ';">' + fmt(d.amount || 0) + '</td>';
      html += '<td>' + (d.description || '-') + '</td>';
      html += '<td>' + statusBadge(d.status || 'Pending') + '</td>';
      html += '</tr>';
    }
    // Grand total row
    html += '<tr style="background:var(--accent-light);font-weight:800;">';
    html += '<td colspan="3" style="text-align:right;padding:10px;font-size:13px;color:var(--accent-dark);">Grand Total (' + data.length + ' entries):</td>';
    html += '<td style="text-align:right;padding:10px;font-size:14px;color:' + (isCashIn ? 'var(--accent-dark)' : 'var(--danger)') + ';">' + fmt(cashGrandTotal) + '</td>';
    html += '<td colspan="2"></td>';
    html += '</tr>';
  } else {
    html += '</tr></thead><tbody>';
    for (var i = 0; i < data.length; i++) {
      var d = data[i];
      html += '<tr><td>' + (i+1) + '</td><td style="font-weight:600;">' + (d.invoice || d.chalan || d.ref) + '</td><td>' + d.date + '</td><td style="font-weight:600;">' + (type==='purchase' ? fmt(d.total) : d.qty) + '</td><td>' + statusBadge(d.status) + '</td></tr>';
    }
  }
  html += '</tbody></table></div></div>';
  return html;
}

function drawReportPie() {
  var canvas = document.getElementById('reportPie');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var type = currentPage.replace('report-', '');
  var map = { purchase: DB.purchases, delivery: DB.deliveries, adjustment: DB.adjustments, damage: DB.damages };
  var data = map[type];
  if (!data) return;
  var vals = [
    data.filter(function(d){return d.status==='Approved';}).length,
    data.filter(function(d){return d.status==='Pending';}).length,
    data.filter(function(d){return d.status==='Rejected';}).length,
  ];
  var colors = ['#2d8a4e', '#d97706', '#dc2626'];
  var lbls = ['Approved', 'Pending', 'Rejected'];
  var total = vals[0] + vals[1] + vals[2] || 1;
  var cx = W * 0.35, cy = H / 2, r = Math.min(cx, cy) - 20;
  var startAngle = -Math.PI / 2;
  for (var i = 0; i < vals.length; i++) {
    var sliceAngle = (vals[i] / total) * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, Math.max(r, 1), startAngle, startAngle + sliceAngle);
    ctx.closePath(); ctx.fillStyle = colors[i]; ctx.fill();
    startAngle += sliceAngle;
  }
  ctx.beginPath(); ctx.arc(cx, cy, Math.max(r * 0.55, 1), 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.fillStyle = '#1a2e1a'; ctx.font = 'bold 22px Outfit'; ctx.textAlign = 'center';
  ctx.fillText(total, cx, cy + 4);
  ctx.font = '12px Outfit'; ctx.fillStyle = '#6b7c6b'; ctx.fillText('Total', cx, cy + 20);
  var lx = W * 0.7;
  for (var j = 0; j < lbls.length; j++) {
    var ly = 50 + j * 40;
    ctx.fillStyle = colors[j];
    ctx.beginPath(); ctx.rect(lx, ly, 16, 16); ctx.fill();
    ctx.fillStyle = '#1a2e1a'; ctx.font = '600 14px Outfit'; ctx.textAlign = 'left';
    ctx.fillText(lbls[j], lx + 24, ly + 13);
    ctx.fillStyle = '#6b7c6b'; ctx.font = '13px Outfit';
    ctx.fillText(vals[j] + ' items', lx + 24, ly + 30);
  }
}

// Count active privileges in a role's permissions object
function countRolePermissions(perms) {
  if (!perms || typeof perms !== 'object') return 0;
  if (perms.fullAccess) return 99; // special marker for full access
  var count = 0;
  for (var k in perms) {
    if (perms[k] && perms[k].length > 0) count++;
  }
  return count;
}

// Human-readable summary of a role's permissions
function summarizePermissions(perms) {
  if (!perms || typeof perms !== 'object') return 'No permissions set';
  if (perms.fullAccess) return 'Full access to all modules';
  var parts = [];
  for (var k in perms) {
    if (perms[k] && perms[k].length > 0) {
      parts.push(k + ' (' + perms[k].length + ')');
    }
  }
  return parts.length ? parts.join(', ') : 'No permissions set';
}

// Check if current user has permission to do an action on a module or submenu.
// Returns true if allowed, false otherwise. Super Admin always returns true.
//
// Resolution order:
//   1. If `module` is a submenu id (e.g. 'branch-list') AND the role has an
//      explicit permission array for that submenu id, use it.
//   2. Otherwise, fall back to the PARENT module's permission array (if any).
//   3. Otherwise, deny.
//
// This means a role that only sets `branch: ['view']` will still allow viewing
// `branch-list` (parent fallback). And a role that sets `branch-list: ['view']`
// but not `branch` will also allow viewing `branch-list` (submenu direct).
function can(module, action) {
  if (!currentUser) return false;
  if (currentUser.role === 'Super Admin') return true;
  // Find the user's role in DB.roles
  var roleObj = null;
  for (var i = 0; i < DB.roles.length; i++) {
    if (DB.roles[i].name === currentUser.role) { roleObj = DB.roles[i]; break; }
  }
  if (!roleObj) return false;
  var perms = roleObj.permissions || {};
  if (perms.fullAccess) return true;

  // Step 1: try the exact module/submenu id
  var modulePerms = perms[module];
  if (modulePerms && Array.isArray(modulePerms) && modulePerms.indexOf(action) !== -1) {
    return true;
  }

  // Step 2: if this is a submenu, fall back to parent module perms
  var parentModule = pageToModule(module);
  if (parentModule && parentModule !== module) {
    var parentPerms = perms[parentModule];
    if (parentPerms && Array.isArray(parentPerms) && parentPerms.indexOf(action) !== -1) {
      return true;
    }
  }

  return false;
}

// Map a page ID (e.g. 'branch-list') to its parent NAV module ID (e.g. 'branch')
function pageToModule(pageId) {
  for (var i = 0; i < NAV.length; i++) {
    var item = NAV[i];
    if (item.id === pageId) return item.id;
    if (item.children) {
      for (var j = 0; j < item.children.length; j++) {
        if (item.children[j].id === pageId) return item.id;
      }
    }
  }
  return null;
}

// Enforce permission checks on the currently-rendered page.
// Hides Add/Edit/Delete/Export/Import/Print buttons based on the user's role.
// Super Admin is always allowed everything (early return).
function enforceActionPermissions() {
  if (!currentUser || currentUser.role === 'Super Admin') return;
  // Use currentPage directly so submenu-specific perms are checked first
  // (with fallback to parent module perms inside can()).
  var module = currentPage;
  if (!module) return;

  // Helper to hide an element
  function hide(el) { if (el) el.style.display = 'none'; }

  // ===== HIDE: Add New / Create buttons =====
  if (!can(module, 'add')) {
    // Top-level Add New / Create buttons
    document.querySelectorAll('[id^="btn-add-"], [id^="btn-create-"]').forEach(hide);
  }

  // ===== HIDE: Edit buttons (both top-level and row-level) =====
  if (!can(module, 'edit')) {
    // Row-level Edit buttons (various naming conventions used across modules)
    // Pattern: data-edit-<module>  or  data-edit-simple  or  data-edit-del  etc.
    document.querySelectorAll('[data-edit-branch], [data-edit-emp], [data-edit-prod], [data-edit-sup], [data-edit-pur], [data-edit-del], [data-edit-adj], [data-edit-dmg], [data-edit-trf], [data-edit-simple], [data-edit-role], [data-edit-user]').forEach(hide);
    // Approval page Edit buttons (data-approve-edit-<type> on approval-purchase / approval-delivery / approval-adjustment / approval-damage)
    document.querySelectorAll('[data-approve-edit-pur], [data-approve-edit-del], [data-approve-edit-adj], [data-approve-edit-dmg]').forEach(hide);
    // Top-level Edit buttons (rare, but safety)
    document.querySelectorAll('[id^="btn-edit-"]').forEach(hide);
  }

  // ===== HIDE: Delete buttons (both naming variants) =====
  if (!can(module, 'delete')) {
    // data-del-* (short form used by most modules)
    document.querySelectorAll('[data-del-branch], [data-del-emp], [data-del-prod], [data-del-sup], [data-del-pur], [data-del-del], [data-del-adj], [data-del-dmg], [data-del-trf], [data-del-simple], [data-del-role], [data-del-user], [data-del-quote], [data-del-invoice], [data-del-chalan]').forEach(hide);
    // data-delete-* (full word form, used by branch)
    document.querySelectorAll('[data-delete-branch], [data-delete-emp], [data-delete-prod], [data-delete-sup], [data-delete-pur], [data-delete-del], [data-delete-adj], [data-delete-dmg], [data-delete-trf], [data-delete-role], [data-delete-user]').forEach(hide);
    // Approval page Delete buttons (data-approve-del-<type>)
    document.querySelectorAll('[data-approve-del-purchase], [data-approve-del-delivery], [data-approve-del-adjustment], [data-approve-del-damage]').forEach(hide);
    // Top-level Delete buttons
    document.querySelectorAll('[id^="btn-del-"], [id^="btn-delete-"]').forEach(hide);
  }

  // ===== HIDE: Approve buttons (approval pages only) =====
  // The Approve action is conceptually closer to "edit" (modifies status field),
  // so we hide [data-approve] when the user lacks edit permission on this submenu.
  if (!can(module, 'edit')) {
    document.querySelectorAll('[data-approve]').forEach(hide);
  }

  // ===== HIDE: Export buttons =====
  if (!can(module, 'export')) {
    document.querySelectorAll('[id^="btn-export-"], [id^="btn-backup-db"], [data-export]').forEach(hide);
  }

  // ===== HIDE: Import buttons =====
  if (!can(module, 'import')) {
    document.querySelectorAll('[id^="btn-import-"], [id^="btn-restore-db"], [data-import]').forEach(hide);
  }

  // ===== HIDE: Print buttons =====
  if (!can(module, 'print')) {
    // Row-level Print buttons: data-print-<module>
    document.querySelectorAll('[data-print-del], [data-print-adj], [data-print-dmg], [data-print-trf], [data-print-pur], [data-print-branch], [data-print-emp], [data-print-prod], [data-print-sup]').forEach(hide);
    // Top-level Print buttons
    document.querySelectorAll('[id^="btn-print-"]').forEach(hide);
    // Inline onclick print buttons
    document.querySelectorAll('[onclick*="print"], [onclick*="Print"]').forEach(hide);
  }
}

// Render the Create/Edit Role modal with full privilege matrix
function openRoleModal(editId) {
  var r = null;
  var title = 'Create Role';
  if (editId) {
    for (var i = 0; i < DB.roles.length; i++) {
      if (DB.roles[i].id === editId) { r = DB.roles[i]; break; }
    }
    if (r) title = 'Edit Role: ' + r.name;
  }

  var isSuperAdmin = r && r.name === 'Super Admin';
  var perms = (r && r.permissions && typeof r.permissions === 'object') ? r.permissions : {};
  var fullAccess = perms.fullAccess || isSuperAdmin;

  var html = '<div style="padding:24px;max-width:780px;">' + modalHeader(title) + '<div style="padding-top:16px;">';

  // Role name + description
  html += '<div class="form-group"><label class="form-label">Role Name</label>';
  html += '<input class="form-input" id="f-role-name" value="' + (r ? r.name : '') + '" placeholder="e.g. Super Admin, Admin, Manager, General User"' + (isSuperAdmin ? ' readonly' : '') + '></div>';

  html += '<div class="form-group"><label class="form-label">Description</label>';
  html += '<input class="form-input" id="f-role-desc" value="' + (r ? (r.description || '') : '') + '" placeholder="Brief description of this role\'s purpose"></div>';

  // Full access toggle
  html += '<div style="background:' + (fullAccess ? 'var(--accent-light)' : '#f6f8f6') + ';border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;gap:12px;">';
  html += '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;">';
  html += '<input type="checkbox" id="f-role-fullaccess" ' + (fullAccess ? 'checked' : '') + ' style="width:18px;height:18px;cursor:pointer;accent-color:var(--accent);"' + (isSuperAdmin ? ' disabled' : '') + '>';
  html += '<div>';
  html += '<div style="font-weight:600;color:var(--fg);font-size:14px;"><i class="fas fa-crown" style="color:var(--warning);margin-right:6px;"></i>Full Access</div>';
  html += '<div style="font-size:12px;color:var(--muted);">Grant all permissions to every module (overrides individual selections)</div>';
  html += '</div></label></div>';

  // Privilege matrix header
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">';
  html += '<div style="font-size:14px;font-weight:700;color:var(--fg);"><i class="fas fa-shield-halved" style="color:var(--accent);margin-right:8px;"></i>Module Privileges</div>';
  html += '<div style="font-size:12px;color:var(--muted);">Select which actions each module can perform</div>';
  html += '</div>';

  // Build the matrix
  html += '<div id="privilege-matrix" style="border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card);max-height:400px;overflow-y:auto;' + (fullAccess ? 'opacity:0.5;pointer-events:none;' : '') + '">';

  // Header row with action labels
  html += '<div style="display:grid;grid-template-columns:180px repeat(' + PRIVILEGE_ACTIONS.length + ',1fr);background:#f6f8f6;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:5;">';
  html += '<div style="padding:10px 14px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;">Module</div>';
  for (var ai = 0; ai < PRIVILEGE_ACTIONS.length; ai++) {
    html += '<div style="padding:10px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;" title="' + PRIVILEGE_ACTIONS[ai].label + '"><i class="fas ' + PRIVILEGE_ACTIONS[ai].icon + '"></i></div>';
  }
  html += '</div>';

  // One row per module + (optionally) submenu rows indented beneath
  for (var mi = 0; mi < PRIVILEGE_MODULES.length; mi++) {
    var mod = PRIVILEGE_MODULES[mi];
    var modPerms = perms[mod.id] || [];
    if (!Array.isArray(modPerms)) modPerms = [];

    html += '<div style="display:grid;grid-template-columns:180px repeat(' + PRIVILEGE_ACTIONS.length + ',1fr);border-bottom:1px solid var(--border);' + (mi % 2 === 1 ? 'background:#fafdfa;' : '') + '">';
    html += '<div style="padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--fg);"><i class="fas ' + mod.icon + '" style="color:var(--accent);width:16px;text-align:center;"></i>' + mod.label + '</div>';

    for (var bi = 0; bi < PRIVILEGE_ACTIONS.length; bi++) {
      var act = PRIVILEGE_ACTIONS[bi];
      var checked = modPerms.indexOf(act.id) !== -1;
      html += '<div style="padding:8px;text-align:center;">';
      html += '<label style="display:inline-flex;align-items:center;justify-content:center;cursor:pointer;" title="' + act.label + '">';
      html += '<input type="checkbox" class="priv-checkbox" data-module="' + mod.id + '" data-action="' + act.id + '" ' + (checked ? 'checked' : '') + ' style="width:16px;height:16px;cursor:pointer;accent-color:var(--accent);">';
      html += '</label></div>';
    }
    html += '</div>';

    // Render submenu rows (indented, lighter) for modules that have children
    if (mod.children && mod.children.length) {
      for (var ci = 0; ci < mod.children.length; ci++) {
        var sub = mod.children[ci];
        var subPerms = perms[sub.id] || [];
        if (!Array.isArray(subPerms)) subPerms = [];

        html += '<div style="display:grid;grid-template-columns:180px repeat(' + PRIVILEGE_ACTIONS.length + ',1fr);border-bottom:1px solid var(--border);background:#fbfdfb;">';
        html += '<div style="padding:7px 14px 7px 32px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--muted);"><i class="fas fa-angle-right" style="color:var(--muted);width:14px;text-align:center;font-size:10px;"></i>' + sub.label + '</div>';
        for (var sbi = 0; sbi < PRIVILEGE_ACTIONS.length; sbi++) {
          var sact = PRIVILEGE_ACTIONS[sbi];
          var schecked = subPerms.indexOf(sact.id) !== -1;
          html += '<div style="padding:6px;text-align:center;">';
          html += '<label style="display:inline-flex;align-items:center;justify-content:center;cursor:pointer;" title="' + sact.label + '">';
          html += '<input type="checkbox" class="priv-checkbox" data-module="' + sub.id + '" data-action="' + sact.id + '" ' + (schecked ? 'checked' : '') + ' style="width:14px;height:14px;cursor:pointer;accent-color:var(--accent);">';
          html += '</label></div>';
        }
        html += '</div>';
      }
    }
  }
  html += '</div>';

  // Quick presets
  html += '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">';
  html += '<span style="font-size:12px;color:var(--muted);margin-right:4px;">Quick presets:</span>';
  html += '<button type="button" class="btn btn-secondary btn-sm" id="preset-all"><i class="fas fa-check-double"></i> Select All</button>';
  html += '<button type="button" class="btn btn-secondary btn-sm" id="preset-view-only"><i class="fas fa-eye"></i> View Only</button>';
  html += '<button type="button" class="btn btn-secondary btn-sm" id="preset-clear"><i class="fas fa-eraser"></i> Clear All</button>';
  html += '</div>';

  // Footer
  html += '</div><div style="padding:0 0 20px;display:flex;gap:12px;justify-content:flex-end;margin-top:18px;">';
  html += '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>';
  html += '<button class="btn btn-primary" id="btn-save-role"><i class="fas fa-save"></i> ' + (r ? 'Update Role' : 'Create Role') + '</button>';
  html += '</div></div>';

  openModal(html);

  // Modal box should be wider
  var modalBox = document.getElementById('modal-box');
  if (modalBox) { modalBox.style.width = '780px'; modalBox.style.maxWidth = '95vw'; }

  // Wire up "Select All" / "View Only" / "Clear All" preset buttons
  var presetAll = document.getElementById('preset-all');
  var presetView = document.getElementById('preset-view-only');
  var presetClear = document.getElementById('preset-clear');
  var fullAccessToggle = document.getElementById('f-role-fullaccess');
  var matrix = document.getElementById('privilege-matrix');

  function setAllCheckboxes(values) {
    var cbs = matrix.querySelectorAll('.priv-checkbox');
    for (var i = 0; i < cbs.length; i++) {
      var cb = cbs[i];
      cb.checked = values.indexOf(cb.getAttribute('data-action')) !== -1;
    }
  }

  if (presetAll) presetAll.addEventListener('click', function() {
    setAllCheckboxes(['view','add','edit','delete','export','import','print']);
  });
  if (presetView) presetView.addEventListener('click', function() {
    setAllCheckboxes(['view']);
  });
  if (presetClear) presetClear.addEventListener('click', function() {
    setAllCheckboxes([]);
  });

  // When Full Access is toggled, dim the matrix
  if (fullAccessToggle) fullAccessToggle.addEventListener('change', function() {
    if (matrix) {
      if (this.checked) {
        matrix.style.opacity = '0.5';
        matrix.style.pointerEvents = 'none';
      } else {
        matrix.style.opacity = '1';
        matrix.style.pointerEvents = 'auto';
      }
    }
  });

  // Save handler
  document.getElementById('btn-save-role').addEventListener('click', function() {
    var name = document.getElementById('f-role-name').value.trim();
    var desc = document.getElementById('f-role-desc').value.trim();
    var isFullAccess = fullAccessToggle ? fullAccessToggle.checked : false;
    if (!name) { showToast('Role name required', 'error'); return; }

    // Check duplicate (only when creating new)
    if (!r) {
      for (var i = 0; i < DB.roles.length; i++) {
        if (DB.roles[i].name.toLowerCase() === name.toLowerCase()) { showToast('Role name already exists', 'error'); return; }
      }
    }

    // Build permissions object from checkbox state
    var newPerms = {};
    if (isFullAccess) {
      newPerms.fullAccess = true;
    } else {
      var cbs = matrix.querySelectorAll('.priv-checkbox');
      for (var j = 0; j < cbs.length; j++) {
        var cb = cbs[j];
        if (cb.checked) {
          var mod = cb.getAttribute('data-module');
          var act = cb.getAttribute('data-action');
          if (!newPerms[mod]) newPerms[mod] = [];
          newPerms[mod].push(act);
        }
      }
    }

    // For Super Admin, force fullAccess=true
    if (isSuperAdmin) newPerms.fullAccess = true;

    if (r) {
      // Update existing role
      r.name = name;
      r.description = desc;
      r.permissions = newPerms;
      showToast('Role updated successfully');
    } else {
      // Create new role
      DB.roles.push({
        id: Date.now(),
        name: name,
        description: desc,
        permissions: newPerms
      });
      showToast('Role created successfully');
    }
    closeModal();
    renderPage();
  });
}

function bindRoleEvents() {
  var addBtn = document.getElementById('btn-add-role');
  if (addBtn) addBtn.addEventListener('click', function() { openRoleModal(null); });
  var editBtns = document.querySelectorAll('[data-edit-role]');
  for (var i = 0; i < editBtns.length; i++) {
    (function(btn) { btn.addEventListener('click', function() { openRoleModal(parseInt(btn.getAttribute('data-edit-role'))); }); })(editBtns[i]);
  }
  var delBtns = document.querySelectorAll('[data-del-role]');
  for (var j = 0; j < delBtns.length; j++) {
    (function(btn) { btn.addEventListener('click', function() { deleteItem('roles', parseInt(btn.getAttribute('data-del-role')), 'role-list'); }); })(delBtns[j]);
  }
}

function bindBackupRestoreEvents() {
  var backupBtn = document.getElementById('btn-backup-db');
