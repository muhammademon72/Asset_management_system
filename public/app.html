// ==================== SEARCHABLE SELECT (Purchase modal) ====================
function purSearchableHTML(name, dataAttr, options, selectedValue, placeholder, searchPlaceholder) {
  var sel = null;
  for (var i = 0; i < options.length; i++) { if (options[i].value === selectedValue) { sel = options[i]; break; } }
  var display = sel ? sel.label : '<span style="color:var(--muted);">' + (placeholder || 'Select') + '</span>';
  var h = '<div class="pur-sr" data-sr="' + name + '">';
  h += '<input type="hidden" ' + dataAttr + ' value="' + (selectedValue || '') + '">';
  h += '<button type="button" class="pur-sr-trigger">' + display + '<i class="fas fa-chevron-down pur-sr-caret"></i></button>';
  h += '<div class="pur-sr-panel" style="display:none;">';
  h += '<div class="pur-sr-search"><i class="fas fa-search"></i><input type="text" class="pur-sr-search-input" placeholder="' + (searchPlaceholder || 'Search...') + '"></div>';
  h += '<div class="pur-sr-options">';
  if (options.length === 0) {
    h += '<div class="pur-sr-empty">No options</div>';
  } else {
    // Whitelist of extra data attributes we support on options (in addition to value/label/category)
    var extraAttrs = ['brand', 'model', 'serial', 'condition', 'warranty', 'empId', 'department', 'branch', 'stock'];
    for (var i = 0; i < options.length; i++) {
      var v = (options[i].value || '').toString().replace(/"/g, '&quot;');
      var l = (options[i].label || '').toString();
      var ls = l.toLowerCase().replace(/"/g, '&quot;');
      var c = (options[i].category || '').toString().replace(/"/g, '&quot;');
      // Also include serial in the searchable label so users can search by serial
      var serialStr = (options[i].serial || '').toString();
      var searchStr = ls + (serialStr ? ' ' + serialStr.toLowerCase().replace(/"/g, '&quot;') : '');
      h += '<div class="pur-sr-option' + (options[i].value === selectedValue ? ' selected' : '') + '" data-value="' + v + '" data-label="' + searchStr + '" data-category="' + c + '"';
      // Add extra data attributes
      for (var ea = 0; ea < extraAttrs.length; ea++) {
        var attrName = extraAttrs[ea];
        if (options[i][attrName] !== undefined && options[i][attrName] !== null && options[i][attrName] !== '') {
          h += ' data-' + attrName + '="' + options[i][attrName].toString().replace(/"/g, '&quot;') + '"';
        }
      }
      h += '>' + l + '</div>';
    }
  }
  h += '</div></div></div>';
  return h;
}

function closeAllPurPanels() {
  var panels = document.querySelectorAll('.pur-sr-panel');
  for (var i = 0; i < panels.length; i++) panels[i].style.display = 'none';
}

function cleanupPurPanels() {
  var panels = document.querySelectorAll('body > .pur-sr-panel');
  for (var i = 0; i < panels.length; i++) panels[i].remove();
}

function positionPurPanel(trigger, panel) {
  var rect = trigger.getBoundingClientRect();
  var panelWidth = Math.max(rect.width, 220);
  var top = rect.bottom + 2;
  var left = rect.left;
  // If not enough space below, open above
  var spaceBelow = window.innerHeight - rect.bottom;
  if (spaceBelow < 280 && rect.top > 280) { top = rect.top - 280 - 2; }
  // If panel would go off right edge, shift left
  if (left + panelWidth > window.innerWidth - 8) { left = window.innerWidth - panelWidth - 8; }
  if (left < 8) left = 8;
  panel.style.top = top + 'px';
  panel.style.left = left + 'px';
  panel.style.width = panelWidth + 'px';
}

function bindPurSearchable(wrapper, onSelectCallback) {
  if (!wrapper || wrapper.dataset.srBound === '1') return;
  wrapper.dataset.srBound = '1';
  var trigger = wrapper.querySelector('.pur-sr-trigger');
  var panel = wrapper.querySelector('.pur-sr-panel');
  var search = wrapper.querySelector('.pur-sr-search-input');
  var hidden = wrapper.querySelector('input[type="hidden"]');
  var options = wrapper.querySelectorAll('.pur-sr-option');
  if (!trigger || !panel) return;

  // Detach panel to body so it isn't clipped by overflow containers
  document.body.appendChild(panel);

  trigger.addEventListener('click', function(e) {
    e.stopPropagation();
    var isOpen = panel.style.display === 'flex';
    closeAllPurPanels();
    if (isOpen) return;
    positionPurPanel(trigger, panel);
    panel.style.display = 'flex';
    if (search) { search.value = ''; for (var i = 0; i < options.length; i++) options[i].style.display = 'block'; }
    setTimeout(function() { if (search) search.focus(); }, 30);
  });

  if (search) {
    search.addEventListener('input', function() {
      var q = search.value.toLowerCase();
      for (var i = 0; i < options.length; i++) {
        var label = options[i].getAttribute('data-label') || '';
        options[i].style.display = label.indexOf(q) !== -1 ? 'block' : 'none';
      }
    });
    search.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') { panel.style.display = 'none'; trigger.focus(); }
    });
  }

  for (var i = 0; i < options.length; i++) {
    (function(opt) {
      opt.addEventListener('click', function(e) {
        e.stopPropagation();
        var val = opt.getAttribute('data-value');
        var lbl = opt.textContent;
        var cat = opt.getAttribute('data-category') || '';
        // Build a full option data object from all data-* attributes
        var optData = { value: val, label: lbl, category: cat };
        var extraKeys = ['brand', 'model', 'serial', 'condition', 'warranty', 'empId', 'department', 'branch', 'stock'];
        for (var ek = 0; ek < extraKeys.length; ek++) {
          var av = opt.getAttribute('data-' + extraKeys[ek]);
          if (av !== null) optData[extraKeys[ek]] = av;
        }
        hidden.value = val;
        trigger.innerHTML = lbl + '<i class="fas fa-chevron-down pur-sr-caret"></i>';
        for (var j = 0; j < options.length; j++) options[j].classList.remove('selected');
        opt.classList.add('selected');
        panel.style.display = 'none';
        if (onSelectCallback) onSelectCallback(val, lbl, cat, wrapper, optData);
      });
    })(options[i]);
  }
}

function bindAllPurSearchable(scope, onSelectCallback) {
  var wrappers = (scope || document).querySelectorAll('.pur-sr');
  for (var i = 0; i < wrappers.length; i++) bindPurSearchable(wrappers[i], onSelectCallback);
}

function setPurSearchableValue(wrapper, value, label) {
  if (!wrapper) return;
  var hidden = wrapper.querySelector('input[type="hidden"]');
  var trigger = wrapper.querySelector('.pur-sr-trigger');
  if (!hidden || !trigger) return;
  hidden.value = value || '';
  if (value) {
    trigger.innerHTML = label + '<i class="fas fa-chevron-down pur-sr-caret"></i>';
    var options = wrapper.querySelectorAll('.pur-sr-option');
    for (var i = 0; i < options.length; i++) {
      if (options[i].getAttribute('data-value') === value) options[i].classList.add('selected');
      else options[i].classList.remove('selected');
    }
  }
}

// Global handlers: click outside / scroll / resize closes panels
if (!window._purSrGlobalInit) {
  window._purSrGlobalInit = true;
  document.addEventListener('click', function(e) {
    if (!e.target.closest || !e.target.closest('.pur-sr')) closeAllPurPanels();
  });
  window.addEventListener('scroll', closeAllPurPanels, true);
  window.addEventListener('resize', closeAllPurPanels, true);
}

function purTableRowHTML(catOpts, brandOpts, prdOpts, prdArr) {
  var h = '<tr>';
  h += '<td class="pur-td">' + purSearchableHTML('product', 'data-f="product"', prdArr || [], '', 'Select Product', 'Search product...') + '</td>';
  h += '<td class="pur-td"><select data-f="category" disabled style="background:#f5f7f5;color:var(--muted);cursor:not-allowed;">' + catOpts + '</select></td>';
  h += '<td class="pur-td"><select data-f="brand">' + brandOpts + '</select></td>';

window.purCalcRowTotal = function(el) {

function bindCashInEvents() {
  var btn = document.getElementById('btn-add-cashin');

      var amount = Number(document.getElementById('f-ci-amount').value);
      if (!amount) { showToast('Amount required', 'error'); return; }
      var attachInput = document.getElementById('f-ci-attach');
      var attachInfo = null;
      if (attachInput && attachInput.files && attachInput.files.length > 0) {
        var f = attachInput.files[0];
        if (f.size > 5 * 1024 * 1024) { showToast('Attachment too large (max 5 MB)', 'error'); return; }
        showToast('Reading attachment...', 'info');
        readFileAsDataURL(f).then(function(dataUrl) {
          attachInfo = { name: f.name, type: f.type || 'File', size: (f.size / 1024).toFixed(1) + ' KB', data: dataUrl };
          saveCashIn();
        }).catch(function(err) {
          showToast('Could not read attachment: ' + err.message, 'error');
          saveCashIn();
        });
      } else {
        saveCashIn();
      }
      function saveCashIn() {
        DB.cashIn.push({
          id: Date.now(),
          voucher: 'CI-' + Date.now(),
          date: document.getElementById('f-ci-date').value,
          amount: amount,
          description: document.getElementById('f-ci-desc').value.trim(),
          status: document.getElementById('f-ci-status').value,
          attachment: attachInfo
        });
        closeModal(); showToast('Cash In added'); renderPage();
      }
    });
  });

  // Attachment preview
  var attachIcons = document.querySelectorAll('[data-attach-ci]');
  for (var a = 0; a < attachIcons.length; a++) {
    (function(icon) {
      icon.addEventListener('click', function() {
        var ciId = parseInt(icon.getAttribute('data-attach-ci'));
        var ci = null;
        for (var j = 0; j < DB.cashIn.length; j++) { if (DB.cashIn[j].id === ciId) { ci = DB.cashIn[j]; break; } }
        if (!ci) return;
        var html = '<div style="padding:24px;">' + modalHeader('Attachment — ' + ci.voucher) + '<div style="padding-top:16px;">';
        if (ci.attachment && ci.attachment.name) {
          var isImage = ci.attachment.type && ci.attachment.type.indexOf('image/') === 0;
          var isPdf = ci.attachment.type && (ci.attachment.type.indexOf('pdf') !== -1 || ci.attachment.type.indexOf('application/pdf') !== -1);
          var iconClass = isImage ? 'fa-image' : (isPdf ? 'fa-file-pdf' : 'fa-file-alt');
          html += '<div style="border:1px solid var(--border);border-radius:12px;padding:20px;display:flex;align-items:center;gap:16px;margin-bottom:16px;">';
          html += '<div style="width:48px;height:48px;border-radius:10px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fas ' + iconClass + '" style="color:var(--accent);font-size:20px;"></i></div>';

          html += '</div>';
          if (isImage && ci.attachment.data) {
            html += '<div style="border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px;text-align:center;background:#f6f8f6;"><img src="' + ci.attachment.data + '" style="max-width:100%;max-height:300px;object-fit:contain;display:block;margin:0 auto;"></div>';
          }

          if (ci.attachment.data) {

          html += '<div style="font-size:13px;color:var(--muted);">This cash-in entry has no attached file.</div>';

        }
        html += '</div><div style="display:flex;gap:12px;justify-content:flex-end;margin-top:16px;"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div></div>';

// ==================== APPROVAL PAGES ====================
function renderApprovalList(type, data) {
  // Approval pipeline:
  // - Submitted: needs review (shown as pending approval)
  // - Pending: legacy status — also shown as pending approval
  // - Approved / Rejected: shown as already-decided rows
  var pendingStatuses = ['Submitted', 'Pending'];
  var pending = data.filter(function(d){ return pendingStatuses.indexOf(d.status) !== -1; });
  var approved = data.filter(function(d){ return d.status === 'Approved'; });
  var rejected = data.filter(function(d){ return d.status === 'Rejected'; });
  var draft = data.filter(function(d){ return d.status === 'Draft'; });
  var cols, labels = { purchase: 'Purchase', delivery: 'Delivery', adjustment: 'Adjustment', damage: 'Damage' };
  if (type === 'purchase') cols = ['Invoice', 'Date', 'Supplier', 'Product', 'Amount', 'Branch', 'Status'];
  else if (type === 'delivery') cols = ['Chalan', 'Date', 'Product', 'Qty', 'Branch', 'Received By', 'Status'];
  else if (type === 'adjustment') cols = ['Reference', 'Date', 'Product', 'Branch', 'Type', 'Qty', 'Status'];
  else cols = ['Reference', 'Date', 'Product', 'Branch', 'Qty', 'Reason', 'Status'];

  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">';
  html += '<div style="font-size:20px;font-weight:800;">' + labels[type] + ' Approval</div>';
  html += '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;">';
  if (type === 'purchase') {
    html += '<div style="display:flex;align-items:center;gap:6px;font-size:13px;"><div class="pulse-dot" style="background:var(--muted);"></div><span style="font-weight:600;">' + draft.length + ' Draft</span></div>';
  }
  html += '<div style="display:flex;align-items:center;gap:6px;font-size:13px;"><div class="pulse-dot" style="background:var(--warning);"></div><span style="font-weight:600;">' + pending.length + ' Pending</span></div>';
  html += '<div style="display:flex;align-items:center;gap:6px;font-size:13px;"><div class="pulse-dot" style="background:var(--accent);"></div><span style="font-weight:600;">' + approved.length + ' Approved</span></div>';
  html += '<div style="display:flex;align-items:center;gap:6px;font-size:13px;"><div class="pulse-dot" style="background:var(--danger);"></div><span style="font-weight:600;">' + rejected.length + ' Rejected</span></div>';
  html += '</div></div>';
  html += '<div class="stat-card" style="padding:0;overflow:hidden;"><div style="overflow-x:auto;max-height:calc(100vh - 220px);overflow-y:auto;">';
  html += '<table class="data-table" id="main-table"><thead><tr>';
  for (var c = 0; c < cols.length; c++) html += '<th>' + cols[c] + '</th>';
  html += '<th style="width:240px;">Actions</th></tr></thead><tbody>';
  for (var i = 0; i < data.length; i++) {
    var item = data[i];
    // Skip Draft purchases — they belong only to Purchase List, not Approval
    if (item.status === 'Draft') continue;
    html += '<tr>';
    if (type === 'purchase') html += '<td style="font-weight:600;">' + item.invoice + '</td><td>' + item.date + '</td><td>' + item.supplier + '</td><td>' + item.product + '</td><td style="font-weight:600;">' + fmt(item.total) + '</td><td>' + item.branch + '</td>';
    else if (type === 'delivery') html += '<td style="font-weight:600;">' + item.chalan + '</td><td>' + item.date + '</td><td>' + item.product + '</td><td style="text-align:center;">' + item.qty + '</td><td>' + item.branch + '</td><td>' + item.receivedBy + '</td>';
    else if (type === 'adjustment') html += '<td style="font-weight:600;">' + item.ref + '</td><td>' + item.date + '</td><td>' + item.product + '</td><td>' + item.branch + '</td><td><span class="badge ' + (item.type==='Increase'?'badge-green':'badge-red') + '">' + item.type + '</span></td><td style="text-align:center;">' + item.qty + '</td>';
    else html += '<td style="font-weight:600;">' + item.ref + '</td><td>' + item.date + '</td><td>' + item.product + '</td><td>' + item.branch + '</td><td style="text-align:center;">' + item.qty + '</td><td>' + item.reason + '</td>';

    // Status cell (7th column)
    html += '<td>' + statusBadge(item.status) + '</td>';

    // Actions cell — View + Approve + Edit + Delete for all statuses
    html += '<td style="white-space:nowrap;">';
    // View button (always shown)
    html += '<button class="btn btn-secondary btn-sm btn-icon" data-approve-view="' + type + '-' + item.id + '" title="View" style="color:var(--accent);"><i class="fas fa-eye" style="font-size:11px;"></i></button> ';
    // Approve button (shown for pending/submitted only)
    if (pendingStatuses.indexOf(item.status) !== -1) {
      html += '<button class="btn btn-primary btn-sm btn-icon" data-approve="' + type + '-' + item.id + '" title="Approve" style="background:var(--accent);border-color:var(--accent);"><i class="fas fa-check" style="font-size:11px;"></i></button> ';
    }
    // Edit button (shown for pending/submitted only — Approved rows can't be edited)
    if (pendingStatuses.indexOf(item.status) !== -1) {
      var editTarget = (type === 'purchase') ? 'pur' : (type === 'delivery' ? 'del' : (type === 'adjustment' ? 'adj' : 'dmg'));
      html += '<button class="btn btn-secondary btn-sm btn-icon" data-approve-edit-' + editTarget + '="' + item.id + '" title="Edit"><i class="fas fa-pen" style="font-size:11px;"></i></button> ';
    }
    // Delete button (always shown — Draft excluded above so this is for pending/approved/rejected)
    html += '<button class="btn btn-secondary btn-sm btn-icon" data-approve-del-' + type + '="' + item.id + '" title="Delete" style="color:var(--danger);"><i class="fas fa-trash" style="font-size:11px;"></i></button>';
    html += '</td>';
    html += '</tr>';
  }
  html += '</tbody></table></div></div>';
  return html;
}

function bindApprovalEvents() {
  var approveBtns = document.querySelectorAll('[data-approve]');
  for (var i = 0; i < approveBtns.length; i++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        var parts = btn.getAttribute('data-approve').split('-');
        var type = parts[0], id = parseInt(parts.slice(1).join('-'));
        var map = { purchase: 'purchases', delivery: 'deliveries', adjustment: 'adjustments', damage: 'damages' };
        var item = DB[map[type]].find(function(x){ return x.id === id; });
        if (item) { item.status = 'Approved'; showToast('Approved successfully'); renderPage(); }
      });
    })(approveBtns[i]);
  }
  var rejectBtns = document.querySelectorAll('[data-reject]');
  for (var j = 0; j < rejectBtns.length; j++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        var parts = btn.getAttribute('data-reject').split('-');
        var type = parts[0], id = parseInt(parts.slice(1).join('-'));
        var map = { purchase: 'purchases', delivery: 'deliveries', adjustment: 'adjustments', damage: 'damages' };
        var item = DB[map[type]].find(function(x){ return x.id === id; });
        if (item) { item.status = 'Rejected'; showToast('Rejected', 'error'); renderPage(); }
      });
    })(rejectBtns[j]);
  }

  // ===== View buttons (open read-only modal) =====
  // For purchases and deliveries, we trigger a synthetic click on the matching
  // data-view-pur / data-view-del button that lives on the Purchase List /
  // Delivery List page — but those aren't visible here. So we render the view
  // modal directly inline.
  var viewBtns = document.querySelectorAll('[data-approve-view]');
  for (var v = 0; v < viewBtns.length; v++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        var parts = btn.getAttribute('data-approve-view').split('-');
        var type = parts[0], id = parseInt(parts.slice(1).join('-'));
        var map = { purchase: 'purchases', delivery: 'deliveries', adjustment: 'adjustments', damage: 'damages' };
        var item = DB[map[type]].find(function(x){ return x.id === id; });
        if (!item) { showToast('Item not found', 'error'); return; }
        // Build a simple view modal showing the item's fields (read-only)
        var cols, rowsHTML = '';
        if (type === 'purchase') {
          var allRows = [];
          for (var k = 0; k < DB.purchases.length; k++) {
            if (DB.purchases[k].invoice === item.invoice) allRows.push(DB.purchases[k]);
          }
          var totalQty = 0, grandTotal = 0;
          for (var r = 0; r < allRows.length; r++) { totalQty += allRows[r].qty; grandTotal += allRows[r].total; }
          var html = '<div style="padding:24px;max-width:760px;">' + modalHeader('Purchase — ' + item.invoice) + '<div style="padding-top:16px;">';
          html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin-bottom:16px;font-size:13px;">';
          html += '<div><span style="color:var(--muted);">Date:</span> <strong>' + (item.date || '-') + '</strong></div>';
          html += '<div><span style="color:var(--muted);">Supplier:</span> <strong>' + (item.supplier || '-') + '</strong></div>';
          html += '<div><span style="color:var(--muted);">Branch:</span> <strong>' + (item.branch || '-') + '</strong></div>';
          html += '<div><span style="color:var(--muted);">Status:</span> ' + statusBadge(item.status) + '</div>';
          html += '</div>';
          html += '<div style="border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px;">';
          html += '<table class="data-table" style="font-size:12px;"><thead><tr><th>Product</th><th>Brand</th><th>Model</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>';
          for (var rr = 0; rr < allRows.length; rr++) {
            var row = allRows[rr];
            html += '<tr><td>' + (row.product || '-') + '</td><td>' + (row.brand || '-') + '</td><td>' + (row.model || '-') + '</td><td style="text-align:center;">' + row.qty + '</td><td>' + fmt(row.unitPrice) + '</td><td>' + fmt(row.total) + '</td></tr>';
          }
          html += '<tr style="background:var(--accent-light);font-weight:700;"><td colspan="3" style="text-align:right;">Total:</td><td style="text-align:center;">' + totalQty + '</td><td></td><td>' + fmt(grandTotal) + '</td></tr>';
          html += '</tbody></table></div>';
          if (item.attachment && item.attachment.name) {
            html += '<div style="border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:14px;">';
            html += '<i class="fas fa-paperclip" style="color:var(--accent);"></i>';
            html += '<div style="flex:1;font-size:13px;"><strong>' + item.attachment.name + '</strong> <span style="color:var(--muted);font-size:11px;">(' + (item.attachment.size || '') + ')</span></div>';
            if (item.attachment.data) {
              window._currentAttachView = item.attachment;
              html += '<button class="btn btn-secondary btn-sm" onclick="previewAttachment(window._currentAttachView)"><i class="fas fa-eye"></i> View</button>';
              html += '<button class="btn btn-secondary btn-sm" onclick="downloadAttachment(window._currentAttachView)"><i class="fas fa-download"></i></button>';
            }
            html += '</div>';
          }
          html += '<div style="display:flex;gap:10px;justify-content:flex-end;"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div></div></div>';
          openModal(html);
          var modalBox = document.getElementById('modal-box');
          if (modalBox) { modalBox.style.width = '760px'; modalBox.style.maxWidth = '95vw'; }
        } else if (type === 'delivery') {
          openDeliveryModal(id, true);
        } else if (type === 'adjustment') {
          openAdjustmentModal(id, true);
        } else if (type === 'damage') {
          openDamageModal(id, true);
        }
      });
    })(viewBtns[v]);
  }

  // ===== Edit buttons (open editable modal) =====
  // Purchase edit — go to purchase list and trigger the matching data-edit-pur button
  var purEditBtns = document.querySelectorAll('[data-approve-edit-pur]');
  for (var pe = 0; pe < purEditBtns.length; pe++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        var id = parseInt(btn.getAttribute('data-approve-edit-pur'));
        var pur = DB.purchases.find(function(x){ return x.id === id; });
        if (!pur) return;
        showToast('Editing purchase — redirecting to Purchase List', 'info');
        navigate('purchase-list');
        // After navigation completes, renderPage will run bindPurchaseEvents.
        // We can't easily auto-open the edit modal from here without coupling.
        // Better: store the pending edit ID and let bindPurchaseEvents check it.
        window._pendingPurchaseEditId = id;
        // Wait for navigation then click edit
        setTimeout(function() {
          var editBtn = document.querySelector('[data-edit-pur="' + id + '"]');
          if (editBtn) editBtn.click();
          else showToast('Edit button not found — open from Purchase List', 'info');
        }, 500);
      });
    })(purEditBtns[pe]);
  }
  // Delivery edit
  var delEditBtns = document.querySelectorAll('[data-approve-edit-del]');
  for (var de = 0; de < delEditBtns.length; de++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        var id = parseInt(btn.getAttribute('data-approve-edit-del'));
        navigate('delivery-list');
        setTimeout(function() {
          var editBtn = document.querySelector('[data-edit-del="' + id + '"]');
          if (editBtn) editBtn.click();
          else showToast('Edit button not found — open from Delivery List', 'info');
        }, 500);
      });
    })(delEditBtns[de]);
  }
  // Adjustment edit
  var adjEditBtns = document.querySelectorAll('[data-approve-edit-adj]');
  for (var ae = 0; ae < adjEditBtns.length; ae++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        var id = parseInt(btn.getAttribute('data-approve-edit-adj'));
        navigate('adjustment-list');
        setTimeout(function() {
          var editBtn = document.querySelector('[data-edit-adj="' + id + '"]');
          if (editBtn) editBtn.click();
          else showToast('Edit button not found — open from Adjustment List', 'info');
        }, 500);
      });
    })(adjEditBtns[ae]);
  }
  // Damage edit
  var dmgEditBtns = document.querySelectorAll('[data-approve-edit-dmg]');
  for (var dm = 0; dm < dmgEditBtns.length; dm++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        var id = parseInt(btn.getAttribute('data-approve-edit-dmg'));
        navigate('damage-list');
        setTimeout(function() {
          var editBtn = document.querySelector('[data-edit-dmg="' + id + '"]');
          if (editBtn) editBtn.click();
          else showToast('Edit button not found — open from Damage List', 'info');
        }, 500);
      });
    })(dmgEditBtns[dm]);
  }

  // ===== Delete buttons =====
  var delSelectors = ['[data-approve-del-purchase]', '[data-approve-del-delivery]', '[data-approve-del-adjustment]', '[data-approve-del-damage]'];
  var delCollections = ['purchases', 'deliveries', 'adjustments', 'damages'];
  var delPages = ['approval-purchase', 'approval-delivery', 'approval-adjustment', 'approval-damage'];
  for (var ds = 0; ds < delSelectors.length; ds++) {
    var delBtnList = document.querySelectorAll(delSelectors[ds]);
    for (var di = 0; di < delBtnList.length; di++) {
      (function(btn, collection, page) {
        btn.addEventListener('click', function() {
          deleteItem(collection, parseInt(btn.getAttribute('data-approve-del-' + (collection === 'purchases' ? 'purchase' : collection === 'deliveries' ? 'delivery' : collection === 'adjustments' ? 'adjustment' : 'damage'))), page);
        });
      })(delBtnList[di], delCollections[ds], delPages[ds]);
    }
  }
}

// Purchase Report filter functions
function filterPurchaseReport() {
  var dateFrom = (document.getElementById('filter-date-from') || {}).value || '';
  var dateTo = (document.getElementById('filter-date-to') || {}).value || '';
  var supEl = document.querySelector('[data-sr="filter-supplier"] input[type="hidden"]');
  var invEl = document.querySelector('[data-sr="filter-invoice"] input[type="hidden"]');
  var supplierFilter = supEl ? supEl.value : '';
  var invoiceFilter = invEl ? invEl.value : '';
  var rows = document.querySelectorAll('#main-table tbody tr');
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    // Skip grand total rows
    if (row.style.background && row.style.background.indexOf('accent') !== -1) continue;
    var cells = row.querySelectorAll('td');
    if (cells.length < 5) continue;
    // Purchase columns: #, Supplier, Date, Invoice, Product, ...
    var supplier = (cells[1] || {}).textContent || '';
    var date = (cells[2] || {}).textContent || '';
    var invoice = (cells[3] || {}).textContent || '';
    var matchDate = true;
    if (dateFrom && date < dateFrom) matchDate = false;
    if (dateTo && date > dateTo) matchDate = false;
    var matchSupplier = !supplierFilter || supplier.indexOf(supplierFilter) !== -1;
    var matchInvoice = !invoiceFilter || invoice.indexOf(invoiceFilter) !== -1;
    if (matchDate && matchSupplier && matchInvoice) {
      row.style.display = '';
    } else {
      row.style.display = 'none';
    }
  }
}

function clearPurchaseFilters() {
  var df = document.getElementById('filter-date-from'); if (df) df.value = '';
  var dt = document.getElementById('filter-date-to'); if (dt) dt.value = '';
  var sw = document.querySelector('[data-sr="filter-supplier"]');
  var iw = document.querySelector('[data-sr="filter-invoice"]');
  if (sw) { var st = sw.querySelector('.pur-sr-trigger'); if (st) st.innerHTML = '<span style="color:var(--muted);">All Suppliers</span><i class="fas fa-chevron-down pur-sr-caret"></i>'; var sh = sw.querySelector('input[type="hidden"]'); if (sh) sh.value = ''; }
  if (iw) { var it = iw.querySelector('.pur-sr-trigger'); if (it) it.innerHTML = '<span style="color:var(--muted);">All Invoices</span><i class="fas fa-chevron-down pur-sr-caret"></i>'; var ih = iw.querySelector('input[type="hidden"]'); if (ih) ih.value = ''; }
  filterPurchaseReport();
}

// Revert a delivery — removes it from DB.deliveries so the product quantity
// goes back to Inventory Stock (since stock = purchased - delivered - damaged + adjusted).
// Shows a confirmation modal before deleting.
function revertDelivery(delId) {
  var del = null;
  for (var i = 0; i < DB.deliveries.length; i++) { if (DB.deliveries[i].id === delId) { del = DB.deliveries[i]; break; } }
  if (!del) { showToast('Delivery not found', 'error'); return; }
  // Show confirmation modal
  var html = '<div style="padding:24px;text-align:center;">';
  html += '<div style="width:56px;height:56px;border-radius:50%;background:rgba(217,119,6,0.10);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;"><i class="fas fa-undo" style="color:var(--warning);font-size:22px;"></i></div>';
  html += '<div style="font-size:18px;font-weight:700;margin-bottom:8px;">Revert Delivery to Stock</div>';
  html += '<div style="color:var(--muted);font-size:14px;margin-bottom:8px;">This will remove the delivery record and return the product to Inventory Stock.</div>';
  html += '<div style="background:var(--accent-light);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:20px;text-align:left;font-size:13px;">';
  html += '<strong>Chalan:</strong> ' + (del.chalan || '-') + '<br>';
  html += '<strong>Product:</strong> ' + (del.product || '-') + '<br>';
  html += '<strong>Qty:</strong> ' + (del.qty || 0) + '<br>';
  html += '<strong>Received By:</strong> ' + (del.receivedBy || '-');
  html += '</div>';
  html += '<div style="display:flex;gap:12px;justify-content:center;">';
  html += '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>';
  html += '<button class="btn btn-primary" id="btn-confirm-revert-delivery" style="background:var(--warning);border-color:var(--warning);"><i class="fas fa-undo"></i> Revert to Stock</button>';
  html += '</div></div>';
  openModal(html);
  document.getElementById('btn-confirm-revert-delivery').addEventListener('click', function() {
    DB.deliveries = DB.deliveries.filter(function(x) { return x.id !== delId; });
    closeModal();
    showToast('Delivery reverted — product returned to stock');
    renderPage();
  });
}

  var approved = data.filter(function(d){return d.status==='Approved';}).length;

function drawReportPie() {
  var canvas = document.getElementById('reportPie');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var type = currentPage.replace('report-', '');
  var map = { purchase: DB.purchases, delivery: DB.deliveries, adjustment: DB.adjustments, damage: DB.damages };
  var data = map[type];
  if (!data) return;
  var vals = [
    data.filter(function(d){return d.status==='Approved';}).length,
    data.filter(function(d){return d.status==='Pending';}).length,
    data.filter(function(d){return d.status==='Rejected';}).length,
  ];
  var colors = ['#2d8a4e', '#d97706', '#dc2626'];
  var lbls = ['Approved', 'Pending', 'Rejected'];
  var total = vals[0] + vals[1] + vals[2] || 1;
  var cx = W * 0.35, cy = H / 2, r = Math.min(cx, cy) - 20;
  var startAngle = -Math.PI / 2;
  for (var i = 0; i < vals.length; i++) {
    var sliceAngle = (vals[i] / total) * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, Math.max(r, 1), startAngle, startAngle + sliceAngle);
    ctx.closePath(); ctx.fillStyle = colors[i]; ctx.fill();
    startAngle += sliceAngle;
  }
  ctx.beginPath(); ctx.arc(cx, cy, Math.max(r * 0.55, 1), 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.fillStyle = '#1a2e1a'; ctx.font = 'bold 22px Outfit'; ctx.textAlign = 'center';
  ctx.fillText(total, cx, cy + 4);
  ctx.font = '12px Outfit'; ctx.fillStyle = '#6b7c6b'; ctx.fillText('Total', cx, cy + 20);
  var lx = W * 0.7;
  for (var j = 0; j < lbls.length; j++) {
    var ly = 50 + j * 40;
    ctx.fillStyle = colors[j];
    ctx.beginPath(); ctx.rect(lx, ly, 16, 16); ctx.fill();
    ctx.fillStyle = '#1a2e1a'; ctx.font = '600 14px Outfit'; ctx.textAlign = 'left';
    ctx.fillText(lbls[j], lx + 24, ly + 13);
    ctx.fillStyle = '#6b7c6b'; ctx.font = '13px Outfit';
    ctx.fillText(vals[j] + ' items', lx + 24, ly + 30);
  }
}

    }

  return html;

// Count active privileges in a role's permissions object
function countRolePermissions(perms) {
  if (!perms || typeof perms !== 'object') return 0;
  if (perms.fullAccess) return 99; // special marker for full access
  var count = 0;
  for (var k in perms) {
    if (perms[k] && perms[k].length > 0) count++;
  }
  return count;
}

// Human-readable summary of a role's permissions
function summarizePermissions(perms) {
  if (!perms || typeof perms !== 'object') return 'No permissions set';
  if (perms.fullAccess) return 'Full access to all modules';
  var parts = [];
  for (var k in perms) {
    if (perms[k] && perms[k].length > 0) {
      parts.push(k + ' (' + perms[k].length + ')');
    }
  }
  return parts.length ? parts.join(', ') : 'No permissions set';
}

// Check if current user has permission to do an action on a module
// Returns true if allowed, false otherwise. Super Admin always returns true.
function can(module, action) {
  if (!currentUser) return false;
  if (currentUser.role === 'Super Admin') return true;
  // Find the user's role in DB.roles
  var roleObj = null;
  for (var i = 0; i < DB.roles.length; i++) {
    if (DB.roles[i].name === currentUser.role) { roleObj = DB.roles[i]; break; }
  }
  if (!roleObj) return false;
  var perms = roleObj.permissions || {};
  if (perms.fullAccess) return true;
  var modulePerms = perms[module];
  if (!modulePerms || !Array.isArray(modulePerms)) return false;
  return modulePerms.indexOf(action) !== -1;
}

// Map a page ID (e.g. 'branch-list') to its parent NAV module ID (e.g. 'branch')
function pageToModule(pageId) {
  for (var i = 0; i < NAV.length; i++) {
    var item = NAV[i];
    if (item.id === pageId) return item.id;
    if (item.children) {
      for (var j = 0; j < item.children.length; j++) {
        if (item.children[j].id === pageId) return item.id;
      }
    }
  }
  return null;
}

// Enforce permission checks on the currently-rendered page.
// Hides Add/Edit/Delete/Export/Import/Print buttons based on the user's role.
// Super Admin is always allowed everything (early return).
function enforceActionPermissions() {
  if (!currentUser || currentUser.role === 'Super Admin') return;
  var module = pageToModule(currentPage);
  if (!module) return;

  // Helper to hide an element
  function hide(el) { if (el) el.style.display = 'none'; }

  // ===== HIDE: Add New / Create buttons =====
  if (!can(module, 'add')) {
    // Top-level Add New / Create buttons
    document.querySelectorAll('[id^="btn-add-"], [id^="btn-create-"]').forEach(hide);
  }

  // ===== HIDE: Edit buttons (both top-level and row-level) =====
  if (!can(module, 'edit')) {
    // Row-level Edit buttons (various naming conventions used across modules)
    // Pattern: data-edit-<module>  or  data-edit-simple  or  data-edit-del  etc.
    document.querySelectorAll('[data-edit-branch], [data-edit-emp], [data-edit-prod], [data-edit-sup], [data-edit-pur], [data-edit-del], [data-edit-adj], [data-edit-dmg], [data-edit-trf], [data-edit-simple], [data-edit-role], [data-edit-user]').forEach(hide);
    // Top-level Edit buttons (rare, but safety)
    document.querySelectorAll('[id^="btn-edit-"]').forEach(hide);
  }

  // ===== HIDE: Delete buttons (both naming variants) =====
  if (!can(module, 'delete')) {
    // data-del-* (short form used by most modules)
    document.querySelectorAll('[data-del-branch], [data-del-emp], [data-del-prod], [data-del-sup], [data-del-pur], [data-del-del], [data-del-adj], [data-del-dmg], [data-del-trf], [data-del-simple], [data-del-role], [data-del-user]').forEach(hide);
    // data-delete-* (full word form, used by branch)
    document.querySelectorAll('[data-delete-branch], [data-delete-emp], [data-delete-prod], [data-delete-sup], [data-delete-pur], [data-delete-del], [data-delete-adj], [data-delete-dmg], [data-delete-trf], [data-delete-role], [data-delete-user]').forEach(hide);
    // Top-level Delete buttons
    document.querySelectorAll('[id^="btn-del-"], [id^="btn-delete-"]').forEach(hide);
  }

  // ===== HIDE: Export buttons =====
  if (!can(module, 'export')) {
    document.querySelectorAll('[id^="btn-export-"], [id^="btn-backup-db"], [data-export]').forEach(hide);
  }

  // ===== HIDE: Import buttons =====
  if (!can(module, 'import')) {
    document.querySelectorAll('[id^="btn-import-"], [id^="btn-restore-db"], [data-import]').forEach(hide);
  }

  // ===== HIDE: Print buttons =====
  if (!can(module, 'print')) {
    // Row-level Print buttons: data-print-<module>
    document.querySelectorAll('[data-print-del], [data-print-adj], [data-print-dmg], [data-print-trf], [data-print-pur], [data-print-branch], [data-print-emp], [data-print-prod], [data-print-sup]').forEach(hide);
    // Top-level Print buttons
    document.querySelectorAll('[id^="btn-print-"]').forEach(hide);
    // Inline onclick print buttons
    document.querySelectorAll('[onclick*="print"], [onclick*="Print"]').forEach(hide);
  }
}

  html += '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;">';
  html += '<input type="checkbox" id="f-role-fullaccess" ' + (fullAccess ? 'checked' : '') + ' style="width:18px;height:18px;cursor:pointer;accent-color:var(--accent);"' + (isSuperAdmin ? ' disabled' : '') + '>';
  html += '<div>';
  html += '<div style="font-weight:600;color:var(--fg);font-size:14px;"><i class="fas fa-crown" style="color:var(--warning);margin-right:6px;"></i>Full Access</div>';
  html += '<div style="font-size:12px;color:var(--muted);">Grant all permissions to every module (overrides individual selections)</div>';
  html += '</div></label></div>';

  // Privilege matrix header
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">';
  html += '<div style="font-size:14px;font-weight:700;color:var(--fg);"><i class="fas fa-shield-halved" style="color:var(--accent);margin-right:8px;"></i>Module Privileges</div>';
  html += '<div style="font-size:12px;color:var(--muted);">Select which actions each module can perform</div>';
  html += '</div>';

  // Build the matrix
  html += '<div id="privilege-matrix" style="border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card);max-height:400px;overflow-y:auto;' + (fullAccess ? 'opacity:0.5;pointer-events:none;' : '') + '">';

  // Header row with action labels
  html += '<div style="display:grid;grid-template-columns:180px repeat(' + PRIVILEGE_ACTIONS.length + ',1fr);background:#f6f8f6;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:5;">';
  html += '<div style="padding:10px 14px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;">Module</div>';
  for (var ai = 0; ai < PRIVILEGE_ACTIONS.length; ai++) {
    html += '<div style="padding:10px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;" title="' + PRIVILEGE_ACTIONS[ai].label + '"><i class="fas ' + PRIVILEGE_ACTIONS[ai].icon + '"></i></div>';
  }
  html += '</div>';

  // One row per module
  for (var mi = 0; mi < PRIVILEGE_MODULES.length; mi++) {
    var mod = PRIVILEGE_MODULES[mi];
    var modPerms = perms[mod.id] || [];
    if (!Array.isArray(modPerms)) modPerms = [];

    html += '<div style="display:grid;grid-template-columns:180px repeat(' + PRIVILEGE_ACTIONS.length + ',1fr);border-bottom:1px solid var(--border);' + (mi % 2 === 1 ? 'background:#fafdfa;' : '') + '">';
    html += '<div style="padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--fg);"><i class="fas ' + mod.icon + '" style="color:var(--accent);width:16px;text-align:center;"></i>' + mod.label + '</div>';

    for (var bi = 0; bi < PRIVILEGE_ACTIONS.length; bi++) {
      var act = PRIVILEGE_ACTIONS[bi];
      var checked = modPerms.indexOf(act.id) !== -1;
      html += '<div style="padding:8px;text-align:center;">';
      html += '<label style="display:inline-flex;align-items:center;justify-content:center;cursor:pointer;" title="' + act.label + '">';
      html += '<input type="checkbox" class="priv-checkbox" data-module="' + mod.id + '" data-action="' + act.id + '" ' + (checked ? 'checked' : '') + ' style="width:16px;height:16px;cursor:pointer;accent-color:var(--accent);">';
      html += '</label></div>';
    }
    html += '</div>';
  }
  html += '</div>';

  html += '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">';
  html += '<span style="font-size:12px;color:var(--muted);margin-right:4px;">Quick presets:</span>';
  html += '<button type="button" class="btn btn-secondary btn-sm" id="preset-all"><i class="fas fa-check-double"></i> Select All</button>';
  html += '<button type="button" class="btn btn-secondary btn-sm" id="preset-view-only"><i class="fas fa-eye"></i> View Only</button>';
  html += '<button type="button" class="btn btn-secondary btn-sm" id="preset-clear"><i class="fas fa-eraser"></i> Clear All</button>';
  html += '</div>';

  // Footer
  html += '</div><div style="padding:0 0 20px;display:flex;gap:12px;justify-content:flex-end;margin-top:18px;">';
  html += '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>';
  html += '<button class="btn btn-primary" id="btn-save-role"><i class="fas fa-save"></i> ' + (r ? 'Update Role' : 'Create Role') + '</button>';
  html += '</div></div>';

  openModal(html);

  // Modal box should be wider
  var modalBox = document.getElementById('modal-box');
  if (modalBox) { modalBox.style.width = '780px'; modalBox.style.maxWidth = '95vw'; }

  // Wire up "Select All" / "View Only" / "Clear All" preset buttons
  var presetAll = document.getElementById('preset-all');
  var presetView = document.getElementById('preset-view-only');
  var presetClear = document.getElementById('preset-clear');
  var fullAccessToggle = document.getElementById('f-role-fullaccess');
  var matrix = document.getElementById('privilege-matrix');

  function setAllCheckboxes(values) {
    var cbs = matrix.querySelectorAll('.priv-checkbox');
    for (var i = 0; i < cbs.length; i++) {
      var cb = cbs[i];
      cb.checked = values.indexOf(cb.getAttribute('data-action')) !== -1;
    }
  }

  if (presetAll) presetAll.addEventListener('click', function() {
    setAllCheckboxes(['view','add','edit','delete','export','import','print']);
  });
  if (presetView) presetView.addEventListener('click', function() {
    setAllCheckboxes(['view']);
  });
  if (presetClear) presetClear.addEventListener('click', function() {
    setAllCheckboxes([]);
  });

  // When Full Access is toggled, dim the matrix
  if (fullAccessToggle) fullAccessToggle.addEventListener('change', function() {
    if (matrix) {
      if (this.checked) {
        matrix.style.opacity = '0.5';
        matrix.style.pointerEvents = 'none';
      } else {
        matrix.style.opacity = '1';
        matrix.style.pointerEvents = 'auto';
      }
    }
  });

  // Save handler
  document.getElementById('btn-save-role').addEventListener('click', function() {
    var name = document.getElementById('f-role-name').value.trim();
    var desc = document.getElementById('f-role-desc').value.trim();
    var isFullAccess = fullAccessToggle ? fullAccessToggle.checked : false;
    if (!name) { showToast('Role name required', 'error'); return; }

    // Check duplicate (only when creating new)
    if (!r) {
      for (var i = 0; i < DB.roles.length; i++) {
        if (DB.roles[i].name.toLowerCase() === name.toLowerCase()) { showToast('Role name already exists', 'error'); return; }
      }
    }

    // Build permissions object from checkbox state
    var newPerms = {};
    if (isFullAccess) {
      newPerms.fullAccess = true;
    } else {
      var cbs = matrix.querySelectorAll('.priv-checkbox');
      for (var j = 0; j < cbs.length; j++) {
        var cb = cbs[j];
        if (cb.checked) {
          var mod = cb.getAttribute('data-module');
          var act = cb.getAttribute('data-action');
          if (!newPerms[mod]) newPerms[mod] = [];
          newPerms[mod].push(act);
        }
      }
    }

    // For Super Admin, force fullAccess=true
    if (isSuperAdmin) newPerms.fullAccess = true;

    if (r) {
      // Update existing role
      r.name = name;
      r.description = desc;
      r.permissions = newPerms;
      showToast('Role updated successfully');
    } else {
      // Create new role
      DB.roles.push({
        id: Date.now(),
        name: name,
        description: desc,
        permissions: newPerms
      });
      showToast('Role created successfully');
    }
    closeModal();
    renderPage();
  });
}

// Export entire DB as JSON
function exportFullBackup() {
  var data = {
    type: 'assets-management-system-backup',
    version: '1.0',
    exportedAt: new Date().toISOString(),
    collections: {
      branches: DB.branches,
      employees: DB.employees,
      departments: DB.departments,
      designations: DB.designations,
      products: DB.products,
      categories: DB.categories,
      brands: DB.brands,
      uoms: DB.uoms,
      conditions: DB.conditions,
      warranties: DB.warranties,
      suppliers: DB.suppliers,
      purchases: DB.purchases,
      deliveries: DB.deliveries,
      adjustments: DB.adjustments,
      damages: DB.damages,
      transfers: DB.transfers,
      cashIn: DB.cashIn,
      cashOut: DB.cashOut,
      users: DB.users,
      roles: DB.roles,
      company: DB.company
    }
  };
  var json = JSON.stringify(data, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  var stamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '').replace('T', '-');
  a.download = 'assets-backup-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 100);
  DB._lastBackup = new Date().toISOString();
  var total = 0;
  for (var k in data.collections) { if (Array.isArray(data.collections[k])) total += data.collections[k].length; }
  showToast('Backup exported (' + total + ' records)');
}

// Import DB from JSON
function importFullBackup(evt) {
  var fileInput = evt.target;
  if (!fileInput.files || fileInput.files.length === 0) return;
  var file = fileInput.files[0];
  if (!/\.json$/i.test(file.name)) { showToast('Please select a JSON file', 'error'); fileInput.value = ''; return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      var imported = null;
      if (data && data.collections && typeof data.collections === 'object') imported = data.collections;
      else if (data && data.db && typeof data.db === 'object') imported = data.db;
      else throw new Error('Missing "collections" object');
      // Count records
      var totalRecords = 0;
      var collectionCount = 0;
      for (var k in imported) { if (Array.isArray(imported[k])) { totalRecords += imported[k].length; collectionCount++; } else if (imported[k] && typeof imported[k] === 'object') { collectionCount++; } }
      // Show confirmation modal
      var html = '<div style="padding:24px;">' + modalHeader('Restore Backup') + '<div style="padding-top:16px;">';
      html += '<div style="font-size:14px;color:var(--fg);margin-bottom:10px;">File: <strong>' + file.name + '</strong></div>';
      html += '<div style="font-size:13px;color:var(--muted);margin-bottom:14px;">Found <strong style="color:var(--accent);">' + totalRecords + '</strong> records across <strong style="color:var(--accent);">' + collectionCount + '</strong> collections.</div>';
      html += '<div style="border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--accent-light);margin-bottom:14px;">';
      html += '<div style="font-size:12px;color:var(--accent-dark);font-weight:600;margin-bottom:8px;">Choose restore mode:</div>';
      html += '<label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;margin-bottom:8px;cursor:pointer;"><input type="radio" name="restore-db-mode" value="merge" checked style="margin-top:3px;"> <span><strong>Merge:</strong> Append imported records to existing collections. (Company profile will be overwritten.)</span></label>';
      html += '<label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;cursor:pointer;"><input type="radio" name="restore-db-mode" value="replace" style="margin-top:3px;"> <span><strong>Replace (recommended):</strong> Wipe all current data, then load from backup file.</span></label>';
      html += '</div>';
      html += '<div style="font-size:12px;color:var(--warning);margin-bottom:14px;padding:8px 12px;border:1px solid rgba(217,119,6,0.3);border-radius:6px;background:rgba(217,119,6,0.05);"><i class="fas fa-exclamation-triangle"></i> This action cannot be undone. Consider backing up current data first.</div>';
      html += '</div><div style="padding:0 0 20px;display:flex;gap:12px;justify-content:flex-end;"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button>';
      html += '<button class="btn btn-primary" id="btn-confirm-restore-db"><i class="fas fa-check"></i> Restore Now</button></div></div>';
      openModal(html);
      document.getElementById('btn-confirm-restore-db').addEventListener('click', function() {
        var mode = 'merge';
        var radios = document.getElementsByName('restore-db-mode');
        for (var ri = 0; ri < radios.length; ri++) { if (radios[ri].checked) mode = radios[ri].value; }
        var collectionKeys = ['branches','employees','departments','designations','products','categories','brands','uoms','conditions','warranties','suppliers','purchases','deliveries','adjustments','damages','transfers','cashIn','cashOut','users','roles'];
        var restoredCount = 0;
        for (var i = 0; i < collectionKeys.length; i++) {
          var key = collectionKeys[i];
          if (Array.isArray(imported[key])) {
            if (mode === 'replace') DB[key] = imported[key].slice();
            else { for (var j = 0; j < imported[key].length; j++) DB[key].push(imported[key][j]); }
            restoredCount += imported[key].length;
          }
        }
        if (imported.company && typeof imported.company === 'object') DB.company = imported.company;
        closeModal(); showToast('Restored ' + restoredCount + ' records (' + mode + ' mode)'); renderPage();
      });
    } catch (err) {
      showToast('Invalid JSON: ' + err.message, 'error');
    }
    fileInput.value = '';
  };
  reader.readAsText(file);
}

      var typed = confirmInput ? confirmInput.value.trim().toUpperCase() : '';

        if (res && res.ok) {
          showToast('Server data cleared', 'info');
        } else {
          showToast('Server clear failed — local only', 'error');
        }

// ==================== INIT ====================
// Persist DB to localStorage so user-entered data is never lost on refresh or restart
// ==================== SERVER PERSISTENCE (cross-browser / cross-device) ====================
// Data is now stored on the server (SQLite via /api/db) so that any browser,
// device, or user sees the same data after logging in.
//
// localStorage is still used for the SESSION (logged-in user) and as a fast
// read-cache for the first paint, but the source of truth is the server.

var DB_SAVE_TIMER = null;
var DB_LAST_SAVED_AT = null;     // ISO timestamp of last successful server save
var DB_LOCAL_DIRTY = false;      // true if there are unsaved local changes
var DB_BOOT_DONE = false;        // false until the first server fetch completes

// Build the JSON-serializable snapshot of DB
function buildDBSnapshot() {
  return {
    branches: DB.branches,
    employees: DB.employees,
    departments: DB.departments,
    designations: DB.designations,
    categories: DB.categories,
    brands: DB.brands,
    uoms: DB.uoms,
    products: DB.products,
    suppliers: DB.suppliers,
    conditions: DB.conditions,
    warranties: DB.warranties,
    purchases: DB.purchases,
    deliveries: DB.deliveries,
    adjustments: DB.adjustments,
    damages: DB.damages,
    transfers: DB.transfers,
    cashIn: DB.cashIn,
    cashOut: DB.cashOut,
    users: DB.users,
    roles: DB.roles,
    company: DB.company,
    _lastBackup: DB._lastBackup,
    _savedAt: new Date().toISOString()
  };
}

// Save to server (debounced — 300ms after the last change)
function saveDB() {
  DB_LOCAL_DIRTY = true;
  // Clear any pending save
  if (DB_SAVE_TIMER) clearTimeout(DB_SAVE_TIMER);
  // Schedule a new save in 300ms — coalesces rapid edits into one request
  // (shorter than 800ms because user data loss on refresh is worse than a few extra POSTs)
  DB_SAVE_TIMER = setTimeout(function() { saveDBNow(); }, 300);
}

// Save immediately (no debounce). Called by saveDB debouncer and explicitly
// when a user clicks "Backup" or similar critical actions.
function saveDBNow(onDone) {
  try {
    var payload = buildDBSnapshot();
    DB_LOCAL_DIRTY = false; // optimistic — set true again if save fails
    // Optimistically also cache in localStorage so the next page load
    // can paint quickly before the server round-trip completes.
    try { localStorage.setItem('itAssetDB', JSON.stringify(payload)); } catch (e) {}
    // Fire-and-forget POST — keep UI snappy
    fetch('/api/db', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: payload })
    }).then(function(r) { return r.json(); }).then(function(res) {
      if (res && res.ok) {
        DB_LAST_SAVED_AT = res.updatedAt || new Date().toISOString();
      } else {
        console.warn('saveDB: server returned error', res);
        DB_LOCAL_DIRTY = true; // restore dirty flag so we retry later
      }
      if (onDone) onDone(res);
    }).catch(function(err) {
      console.warn('saveDB: network error', err);
      DB_LOCAL_DIRTY = true; // restore dirty flag so we retry later
      if (onDone) onDone({ ok: false, error: err && err.message });
    });
  } catch (e) {
    console.warn('saveDB failed:', e);
    DB_LOCAL_DIRTY = true;
    if (onDone) onDone({ ok: false, error: e && e.message });
  }
}

// Load DB from server. Falls back to localStorage cache if the server is unreachable.
// This is ASYNC — caller must continue in the callback.
//
// CRITICAL: the SERVER is always the source of truth.
// - On boot, we ALWAYS apply whatever the server returns (replacing localStorage cache).
// - We never push local data to the server during boot — that would overwrite other
//   browsers' changes. Local-to-server push only happens via saveDB() which is
//   called after a user action (Add/Edit/Delete), not on load.
//
// The only exception: if the server is unreachable, we fall back to the localStorage
// cache (best-effort) so the app remains usable offline.
function loadDB(onDone) {
  // Step 1: fetch the authoritative copy from the server FIRST
  fetch('/api/db', { method: 'GET' })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res && res.ok && res.data) {
        // Server is the source of truth — always apply server data
        applyDBData(res.data);
        DB_LAST_SAVED_AT = res.updatedAt || null;
        DB_LOCAL_DIRTY = false; // we just synced — no unsaved changes
        // Refresh the local cache so future loads are fast
        try { localStorage.setItem('itAssetDB', JSON.stringify(res.data)); } catch (e) {}
        DB_BOOT_DONE = true;
        if (onDone) onDone(true);
      } else {
        console.warn('loadDB: server returned error, falling back to localStorage cache', res);
        // Server returned an error — fall back to localStorage cache (best-effort)
        try {
          var cached = localStorage.getItem('itAssetDB');
          if (cached) {
            var cachedData = JSON.parse(cached);
            applyDBData(cachedData);
          }
        } catch (e2) { /* ignore */ }
        DB_BOOT_DONE = true;
        if (onDone) onDone(false);
      }
    })
    .catch(function(err) {
      console.warn('loadDB: network error, using cached/localStorage data', err);
      // Network error — fall back to localStorage cache (best-effort)
      try {
        var cached2 = localStorage.getItem('itAssetDB');
        if (cached2) {
          var cachedData2 = JSON.parse(cached2);
          applyDBData(cachedData2);
        }
      } catch (e3) { /* ignore */ }
      DB_BOOT_DONE = true;
      if (onDone) onDone(false);
    });
}

// Apply a data object to the global DB (replaces arrays but keeps shape)
function applyDBData(data) {
  if (!data || typeof data !== 'object') return;
  var keys = ['branches','employees','departments','designations','categories','brands','uoms','products','suppliers','conditions','warranties','purchases','deliveries','adjustments','damages','transfers','cashIn','cashOut','users','roles'];
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (Array.isArray(data[k])) DB[k] = data[k];
  }
  if (data.company && typeof data.company === 'object') DB.company = data.company;
  if (data._lastBackup) DB._lastBackup = data._lastBackup;
}

// Flush any pending save before the page unloads (refresh / close / navigate).
// Uses sendBeacon (works during unload) AND a synchronous XHR fallback to
// GUARANTEE the save completes before the browser navigates away — this is
// critical for attachment uploads which take longer than a simple text edit.
function flushPendingSave() {
  if (!DB_LOCAL_DIRTY) return;
  // Cancel the debounced timer — we're saving NOW
  if (DB_SAVE_TIMER) { clearTimeout(DB_SAVE_TIMER); DB_SAVE_TIMER = null; }
  var payload = buildDBSnapshot();
  // Always update localStorage first (synchronous, instant)
  try { localStorage.setItem('itAssetDB', JSON.stringify(payload)); } catch (e) {}

  // Strategy 1: sendBeacon (fire-and-forget, works during unload)
  var beaconSent = false;
  if (navigator.sendBeacon) {
    try {
      var blob = new Blob([JSON.stringify({ data: payload })], { type: 'application/json' });
      beaconSent = navigator.sendBeacon('/api/db', blob);
    } catch (e) { beaconSent = false; }
  }

  // Strategy 2: Synchronous XHR — blocks the page unload until the save
  // completes. This is the ONLY way to guarantee attachments (which can be
  // large base64 blobs) are fully persisted before the page reloads.
  // Modern browsers show a brief "Leave site?" dialog for sync XHR during
  // unload, but that's acceptable for data-safety.
  if (!beaconSent) {
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/db', false); // false = synchronous
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.send(JSON.stringify({ data: payload }));
    } catch (e) {
      // Last resort: async fetch with keepalive (may not complete)
      try {
        fetch('/api/db', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: payload }),
          keepalive: true
        });
      } catch (e2) {}
    }
  }

  // Strategy 3: Also fire an async fetch as backup (in case beacon silently fails)
  try {
    fetch('/api/db', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: payload }),
      keepalive: true
    });
  } catch (e) {}

  DB_LOCAL_DIRTY = false;
}

// Wire up flush-on-unload listeners (set up once, after the script loads)
if (!window._flushWired) {
  window._flushWired = true;
  // 'pagehide' is the most reliable cross-browser unload event
  window.addEventListener('pagehide', flushPendingSave);
  // 'beforeunload' fires earlier and gives sendBeacon more time
  // We return undefined (don't trigger the "Leave site?" prompt) —
  // the sync XHR inside flushPendingSave will block briefly but won't prompt.
  window.addEventListener('beforeunload', flushPendingSave);
  // 'visibilitychange' (hidden) fires on tab switch / minimize — good for mobile
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') flushPendingSave();
  });
}

// Clear saved data — used by "Delete All Data" button. Clears both server and localStorage.
function clearSavedDB(onDone) {
  try { localStorage.removeItem('itAssetDB'); } catch (e) {}
  // Tell server to reset to defaults by sending the empty/default DB
  var emptyDB = {
    branches: [], employees: [], departments: [], designations: [],
    categories: [], brands: [], uoms: [], products: [], suppliers: [],
    conditions: [], warranties: [], purchases: [], deliveries: [],
    adjustments: [], damages: [], transfers: [], cashIn: [], cashOut: [],
    users: DB.users,         // keep users so admin can still log in
    roles: DB.roles,         // keep roles too
    company: { name: '', address: '', phone: '', email: '', website: '' },
    _savedAt: new Date().toISOString()
  };
  fetch('/api/db', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ data: emptyDB })
  }).then(function(r) { return r.json(); }).then(function(res) {
    if (onDone) onDone(res);
  }).catch(function(err) {
    console.warn('clearSavedDB: network error', err);
    if (onDone) onDone({ ok: false, error: err && err.message });
  });
}

// Ensure at least one admin user exists in DB.users
// (called after loadDB so that previously-saved empty users list doesn't lock out the admin)
function ensureDefaultAdmin() {
  // Make sure DB.users is an array
  if (!Array.isArray(DB.users)) DB.users = [];
  // Look for the default admin user (by username 'admin')
  var adminExists = false;
  for (var i = 0; i < DB.users.length; i++) {
    if (DB.users[i].username && DB.users[i].username.toLowerCase() === 'admin') {
      adminExists = true;
      // Backfill password if missing (so old admin records can still log in)
      if (!DB.users[i].password) DB.users[i].password = 'admin123';
      if (!DB.users[i].role) DB.users[i].role = 'Super Admin';
      if (!DB.users[i].status) DB.users[i].status = 'Active';
      break;
    }
  }
  if (!adminExists) {
    DB.users.push({
      id: 1,
      name: 'Admin User',
      username: 'admin',
      email: 'admin@itassets.com',
      password: 'admin123',
      role: 'Super Admin',
      status: 'Active'
    });
  }
  // Also ensure default roles exist (so User Create form has options)
  // Migration: if roles have string permissions, migrate to object format
  var needsMigration = false;
  if (Array.isArray(DB.roles)) {
    for (var mi = 0; mi < DB.roles.length; mi++) {
      if (typeof DB.roles[mi].permissions === 'string') { needsMigration = true; break; }
    }
  }
  if (needsMigration) {
    // Convert old string-based permissions to new object-based permissions
    for (var mi2 = 0; mi2 < DB.roles.length; mi2++) {
      var roleName = DB.roles[mi2].name;
      var oldPerm = DB.roles[mi2].permissions;
      var newPerms = {};
      if (roleName === 'Super Admin' || oldPerm === 'Full Access') {
        newPerms.fullAccess = true;
      } else {
        // Try to map old string to module permissions (best-effort migration)
        var allModules = ['dashboard','branch','employee','product','purchase','inventory','cashbook','approval','report','settings'];
        for (var am = 0; am < allModules.length; am++) {
          // Default: grant view + add + edit + export (read-write)
          if (oldPerm && oldPerm.toLowerCase().indexOf(allModules[am]) !== -1) {
            newPerms[allModules[am]] = ['view', 'add', 'edit', 'export', 'print'];
          }
        }
        // Special case for "Viewer" role — read-only on dashboard + report
        if (roleName === 'Viewer') {
          newPerms = { dashboard: ['view'], report: ['view', 'print'] };
        }
      }
      DB.roles[mi2].permissions = newPerms;
    }
  }
  if (!Array.isArray(DB.roles) || DB.roles.length === 0) {
    DB.roles = [
      { id: 1, name: 'Super Admin', description: 'Full system access — can do everything', permissions: { fullAccess: true } },
      { id: 2, name: 'Admin',      description: 'System administration — all modules except settings', permissions: {
        dashboard: ['view','add','edit','delete','export','import','print'],
        branch: ['view','add','edit','delete','export','import'],
        employee: ['view','add','edit','delete','export','import'],
        product: ['view','add','edit','delete','export','import'],
        purchase: ['view','add','edit','delete','export','import','print'],
        inventory: ['view','add','edit','delete','export','print'],
        cashbook: ['view','add','edit','delete','export'],
        approval: ['view','add','edit','print'],
        report: ['view','print','export'],
        settings: ['view'] // Admin can view settings but not edit
      } },
      { id: 3, name: 'Manager',    description: 'Branch-level management — operations + reports', permissions: {
        dashboard: ['view'],
        branch: ['view'],
        employee: ['view','add','edit','export','import'],
        product: ['view','add','edit','export','import'],
        purchase: ['view','add','edit','export','print'],
        inventory: ['view','add','edit','print'],
        cashbook: ['view','add','edit','export'],
        approval: ['view','add','edit','print'],
        report: ['view','print','export']
      } },
      { id: 4, name: 'General User', description: 'Daily operations — limited to assigned tasks', permissions: {
        dashboard: ['view'],
        branch: ['view'],
        employee: ['view'],
        product: ['view'],
        purchase: ['view','add','export'],
        inventory: ['view','add','print'],
        cashbook: ['view','add'],
        report: ['view','print']
      } },
      { id: 5, name: 'Viewer',     description: 'Read-only access — can view reports and data', permissions: {
        dashboard: ['view'],
        report: ['view','print']
      } }
    ];
  }
}

// Show/hide password on login screen
function toggleLoginPassword() {
  var pwd = document.getElementById('login-password');
  var icon = document.getElementById('login-toggle-pass');
  if (!pwd || !icon) return;
  if (pwd.type === 'password') {
    pwd.type = 'text';
    icon.classList.remove('fa-eye');
    icon.classList.add('fa-eye-slash');
  } else {
    pwd.type = 'password';
    icon.classList.remove('fa-eye-slash');
    icon.classList.add('fa-eye');
  }
}

// Attempt login with provided credentials
function attemptLogin() {
  var username = (document.getElementById('login-username').value || '').trim();
  var password = document.getElementById('login-password').value || '';
  var remember = document.getElementById('login-remember').checked;
  if (!username || !password) {
    showLoginError('Please enter both username and password');
    return;
  }
  // Find user
  var user = null;
  for (var i = 0; i < DB.users.length; i++) {
    if (DB.users[i].username && DB.users[i].username.toLowerCase() === username.toLowerCase() && DB.users[i].password === password) {
      user = DB.users[i];
      break;
    }
  }
  if (!user) {
    showLoginError('Invalid username or password');
    return;
  }
  if (user.status !== 'Active') {
    showLoginError('Account is ' + (user.status || 'inactive') + '. Contact administrator.');
    return;
  }
  // Success — set current user and persist session if "remember me"
  currentUser = user;
  if (remember) {
    try { localStorage.setItem(SESSION_KEY, JSON.stringify({ userId: user.id, at: Date.now() })); } catch (e) {}
  } else {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  }
  // Remove login screen
  var ls = document.getElementById('login-screen');
  if (ls) ls.remove();
  // Update top bar with logged-in user
  updateTopBarUser();
  // Welcome toast
  showToast('Welcome, ' + (user.name || user.username) + '! 👋');
  // Re-render nav so permission filtering takes effect for this user
  renderNav();
  // If the user doesn't have view permission for the dashboard, redirect them
  // to the first module they CAN view
  if (!can('dashboard', 'view')) {
    var firstAllowed = null;
    for (var i = 0; i < NAV.length; i++) {
      if (can(NAV[i].id, 'view')) { firstAllowed = NAV[i].id; break; }
    }
    if (firstAllowed) {
      navigate(firstAllowed);
    } else {
      // User has no view permissions at all — show access denied
      currentPage = 'dashboard';
      renderPage();
    }
  } else {
    // Render the first page (dashboard)
    renderPage();
  }
}

// Display an error message on the login form
function showLoginError(msg) {
  var existing = document.getElementById('login-error-msg');
  if (existing) existing.remove();
  var form = document.getElementById('login-form');
  if (!form) return;
  var err = document.createElement('div');
  err.id = 'login-error-msg';
  err.style.cssText = 'background:rgba(220,38,38,0.08);border:1px solid rgba(220,38,38,0.30);color:#dc2626;padding:10px 12px;border-radius:8px;font-size:12px;display:flex;align-items:center;gap:8px;margin-bottom:4px;';
  err.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + msg;
  form.insertBefore(err, form.firstChild);
  // Shake the password field for feedback
  var pwd = document.getElementById('login-password');
  if (pwd) { pwd.value = ''; pwd.focus(); }
}

// Restore session from localStorage (called on page load)
function restoreSession() {
  try {
    var raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return false;
    var data = JSON.parse(raw);
    if (!data || !data.userId) return false;
    for (var i = 0; i < DB.users.length; i++) {
      if (DB.users[i].id === data.userId) {
        // Verify account is still active
        if (DB.users[i].status === 'Active') {
          currentUser = DB.users[i];
          return true;
        }
        localStorage.removeItem(SESSION_KEY);
        return false;
      }
    }
    // User no longer exists — clear stale session
    localStorage.removeItem(SESSION_KEY);
    return false;
  } catch (e) {
    return false;
  }
}

// Update the top bar to show the logged-in user
function updateTopBarUser() {
  var avatarEl = document.getElementById('topbar-user-avatar');
  var nameEl = document.getElementById('topbar-user-name');
  var roleEl = document.getElementById('topbar-user-role');
  if (!currentUser) return;
  var initials = '';
  if (currentUser.name) {
    var parts = currentUser.name.trim().split(/\s+/);
    initials = (parts[0] ? parts[0][0] : '') + (parts[1] ? parts[1][0] : '');
    initials = initials.toUpperCase();
  } else if (currentUser.username) {
    initials = currentUser.username.substring(0, 2).toUpperCase();
  }
  if (avatarEl) avatarEl.textContent = initials;
  if (nameEl) nameEl.textContent = currentUser.name || currentUser.username || 'User';
  if (roleEl) roleEl.textContent = currentUser.role || 'User';
}

// Logout — clear session and show login screen
function logoutUser() {
  // Confirm before logout
  if (!confirm('Are you sure you want to sign out?')) return;
  currentUser = null;
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  // Show the login screen again
  renderLoginPage();
  // Clear top bar user info
  var avatarEl = document.getElementById('topbar-user-avatar');
  var nameEl = document.getElementById('topbar-user-name');
  var roleEl = document.getElementById('topbar-user-role');
  if (avatarEl) avatarEl.textContent = '—';
  if (nameEl) nameEl.textContent = 'Not signed in';
  if (roleEl) roleEl.textContent = '';
  showToast('Signed out successfully');
}

// Show a small dropdown with current user info (placeholder — could link to profile)
function showUserMenu() {
  if (!currentUser) { renderLoginPage(); return; }
  showToast('Signed in as: ' + (currentUser.name || currentUser.username) + ' (' + currentUser.role + ')', 'info');
}

// Show a brief loading splash while we fetch the latest DB from the server.
// This makes the app feel responsive even when the network is slow, and
// ensures the user sees fresh data on every load (cross-browser/cross-device).

function showBootSplash() {
  if (document.getElementById('boot-splash')) return;
  var splash = document.createElement('div');
  splash.id = 'boot-splash';
  splash.style.cssText = 'position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#0f1f0f 0%,#1a2e1a 50%,#2d4a2d 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:white;';
  splash.innerHTML = ''
    + '<div style="width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.25);">'
    + '<i class="fas fa-microchip" style="font-size:30px;"></i>'
    + '</div>'
    + '<div style="font-size:18px;font-weight:700;letter-spacing:0.5px;">Assets Management System</div>'
    + '<div style="display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(255,255,255,0.7);">'
    + '<div style="width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;"></div>'
    + 'Loading data from server...'
    + '</div>'
    + '<style>@keyframes spin{to{transform:rotate(360deg);}}</style>';
  document.body.appendChild(splash);
}

function hideBootSplash() {
  var splash = document.getElementById('boot-splash');
  if (splash) splash.remove();
}

// Start the boot sequence
showBootSplash();
loadDB(function() {
  try {
    // Server data loaded (or fallback used) — finish booting
    ensureDefaultAdmin();
    var sessionRestored = restoreSession();
    // Force the #app container to be visible (in case any prior state hid it)
    var appEl = document.getElementById('app');
    if (appEl) appEl.style.display = 'flex';
    // Render the sidebar nav so the menu is visible immediately
    renderNav();
    if (sessionRestored) {
      updateTopBarUser();
      renderPage();
      hideBootSplash();
    } else {
      renderPage();
      renderLoginPage();
      hideBootSplash();
    }
  } catch(e) {
    console.error('Boot error:', e);
    // Even on error, show the login page so the user isn't stuck on a black screen
    var appEl2 = document.getElementById('app');
    if (appEl2) appEl2.style.display = 'flex';
    try { renderNav(); } catch(e2) {}
    hideBootSplash();
    renderLoginPage();
  }
});
</script>
</body>
