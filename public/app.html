// Export entire DB as JSON
function exportFullBackup() {
  var data = {
    type: 'assets-management-system-backup',
    version: '1.0',
    exportedAt: new Date().toISOString(),
    collections: {
      branches: DB.branches,
      employees: DB.employees,
      departments: DB.departments,
      designations: DB.designations,
      products: DB.products,
      categories: DB.categories,
      brands: DB.brands,
      uoms: DB.uoms,
      conditions: DB.conditions,
      warranties: DB.warranties,
      suppliers: DB.suppliers,
      purchases: DB.purchases,
      deliveries: DB.deliveries,
      adjustments: DB.adjustments,
      damages: DB.damages,
      transfers: DB.transfers,
      cashIn: DB.cashIn,
      cashOut: DB.cashOut,
      users: DB.users,
      roles: DB.roles,
      company: DB.company
    }
  };
  var json = JSON.stringify(data, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  var stamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '').replace('T', '-');
  a.download = 'assets-backup-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 100);
  DB._lastBackup = new Date().toISOString();
  var total = 0;
  for (var k in data.collections) { if (Array.isArray(data.collections[k])) total += data.collections[k].length; }
  showToast('Backup exported (' + total + ' records)');
}

// Import DB from JSON
function importFullBackup(evt) {
  var fileInput = evt.target;
  if (!fileInput.files || fileInput.files.length === 0) return;
  var file = fileInput.files[0];
  if (!/\.json$/i.test(file.name)) { showToast('Please select a JSON file', 'error'); fileInput.value = ''; return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      var imported = null;
      if (data && data.collections && typeof data.collections === 'object') imported = data.collections;
      else if (data && data.db && typeof data.db === 'object') imported = data.db;
      else throw new Error('Missing "collections" object');
      // Count records
      var totalRecords = 0;
      var collectionCount = 0;
      for (var k in imported) { if (Array.isArray(imported[k])) { totalRecords += imported[k].length; collectionCount++; } else if (imported[k] && typeof imported[k] === 'object') { collectionCount++; } }
      // Show confirmation modal
      var html = '<div style="padding:24px;">' + modalHeader('Restore Backup') + '<div style="padding-top:16px;">';
      html += '<div style="font-size:14px;color:var(--fg);margin-bottom:10px;">File: <strong>' + file.name + '</strong></div>';
      html += '<div style="font-size:13px;color:var(--muted);margin-bottom:14px;">Found <strong style="color:var(--accent);">' + totalRecords + '</strong> records across <strong style="color:var(--accent);">' + collectionCount + '</strong> collections.</div>';
      html += '<div style="border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--accent-light);margin-bottom:14px;">';
      html += '<div style="font-size:12px;color:var(--accent-dark);font-weight:600;margin-bottom:8px;">Choose restore mode:</div>';
      html += '<label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;margin-bottom:8px;cursor:pointer;"><input type="radio" name="restore-db-mode" value="merge" checked style="margin-top:3px;"> <span><strong>Merge:</strong> Append imported records to existing collections. (Company profile will be overwritten.)</span></label>';
      html += '<label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;cursor:pointer;"><input type="radio" name="restore-db-mode" value="replace" style="margin-top:3px;"> <span><strong>Replace (recommended):</strong> Wipe all current data, then load from backup file.</span></label>';
      html += '</div>';
      html += '<div style="font-size:12px;color:var(--warning);margin-bottom:14px;padding:8px 12px;border:1px solid rgba(217,119,6,0.3);border-radius:6px;background:rgba(217,119,6,0.05);"><i class="fas fa-exclamation-triangle"></i> This action cannot be undone. Consider backing up current data first.</div>';
      html += '</div><div style="padding:0 0 20px;display:flex;gap:12px;justify-content:flex-end;"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button>';
      html += '<button class="btn btn-primary" id="btn-confirm-restore-db"><i class="fas fa-check"></i> Restore Now</button></div></div>';
      openModal(html);
      document.getElementById('btn-confirm-restore-db').addEventListener('click', function() {
        var mode = 'merge';
        var radios = document.getElementsByName('restore-db-mode');
        for (var ri = 0; ri < radios.length; ri++) { if (radios[ri].checked) mode = radios[ri].value; }
        var collectionKeys = ['branches','employees','departments','designations','products','categories','brands','uoms','conditions','warranties','suppliers','purchases','deliveries','adjustments','damages','transfers','cashIn','cashOut','users','roles'];
        var restoredCount = 0;
        for (var i = 0; i < collectionKeys.length; i++) {
          var key = collectionKeys[i];
          if (Array.isArray(imported[key])) {
            if (mode === 'replace') DB[key] = imported[key].slice();
            else { for (var j = 0; j < imported[key].length; j++) DB[key].push(imported[key][j]); }
            restoredCount += imported[key].length;
          }
        }
        if (imported.company && typeof imported.company === 'object') DB.company = imported.company;
        closeModal(); showToast('Restored ' + restoredCount + ' records (' + mode + ' mode)'); renderPage();
      });
    } catch (err) {
      showToast('Invalid JSON: ' + err.message, 'error');
    }
    fileInput.value = '';
  };
  reader.readAsText(file);
}

// ==================== INIT ====================
// Persist DB to localStorage so user-entered data is never lost on refresh or restart
// ==================== SERVER PERSISTENCE (cross-browser / cross-device) ====================
// Data is now stored on the server (SQLite via /api/db) so that any browser,
// device, or user sees the same data after logging in.
//
// localStorage is still used for the SESSION (logged-in user) and as a fast
// read-cache for the first paint, but the source of truth is the server.

var DB_SAVE_TIMER = null;
var DB_LAST_SAVED_AT = null;     // ISO timestamp of last successful server save
var DB_LOCAL_DIRTY = false;      // true if there are unsaved local changes
var DB_BOOT_DONE = false;        // false until the first server fetch completes

// Build the JSON-serializable snapshot of DB
function buildDBSnapshot() {
  return {
    branches: DB.branches,
    employees: DB.employees,
    departments: DB.departments,
    designations: DB.designations,
    categories: DB.categories,
    brands: DB.brands,
    uoms: DB.uoms,
    products: DB.products,
    suppliers: DB.suppliers,
    conditions: DB.conditions,
    warranties: DB.warranties,
    purchases: DB.purchases,
    deliveries: DB.deliveries,
    adjustments: DB.adjustments,
    damages: DB.damages,
    transfers: DB.transfers,
    cashIn: DB.cashIn,
    cashOut: DB.cashOut,
    quotations: DB.quotations,
    invoices: DB.invoices,
    users: DB.users,
    roles: DB.roles,
    company: DB.company,
    _lastBackup: DB._lastBackup,
    _savedAt: new Date().toISOString()
  };
}

// Save to server (debounced — 300ms after the last change)
function saveDB() {
  DB_LOCAL_DIRTY = true;
  // Clear any pending save
  if (DB_SAVE_TIMER) clearTimeout(DB_SAVE_TIMER);
  // Schedule a new save in 300ms — coalesces rapid edits into one request
  // (shorter than 800ms because user data loss on refresh is worse than a few extra POSTs)
  DB_SAVE_TIMER = setTimeout(function() { saveDBNow(); }, 300);
}

// Save immediately (no debounce). Called by saveDB debouncer and explicitly
// when a user clicks "Backup" or similar critical actions.
// Merge two DB snapshots: for each collection, UNION by id with LOCAL winning
// on id conflicts. This prevents the "last-write-wins" data loss that happens
// when one user's stale DB overwrites another user's recent changes on the server.
//
// Scenario this fixes:
//   1. User A adds a purchase → saved to server.
//   2. Admin had the page open BEFORE User A's save → Admin's local DB is stale.
//   3. Admin refreshes → beforeunload fires → flushPendingSave() POSTs Admin's
//      stale DB → User A's purchase is overwritten and LOST.
//
// With this merge: Admin's save first GETs the latest server DB (which has
// User A's purchase), merges Admin's local items on top, then POSTs the merged
// result → User A's purchase is preserved.
//
// Trade-off: deletions from other users may be "undone" if the local DB still
// has the deleted item. This is an acceptable trade-off for preventing data loss.
function mergeDBWithServer(serverDB, localDB) {
  if (!serverDB || typeof serverDB !== 'object') return buildDBSnapshot();
  var keys = ['branches','employees','departments','designations','categories','brands','uoms','products','suppliers','conditions','warranties','purchases','deliveries','adjustments','damages','transfers','cashIn','cashOut','quotations','invoices','users','roles'];
  var merged = {};
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    var serverArr = Array.isArray(serverDB[k]) ? serverDB[k] : [];
    var localArr = Array.isArray(localDB[k]) ? localDB[k] : [];
    // Build a map of items by id from the server collection
    var byId = {};
    var order = [];  // preserve insertion order
    for (var s = 0; s < serverArr.length; s++) {
      var srvItem = serverArr[s];
      if (srvItem && srvItem.id !== undefined && srvItem.id !== null) {
        var idKey = String(srvItem.id);
        if (!byId[idKey]) { byId[idKey] = srvItem; order.push(idKey); }
        else { byId[idKey] = srvItem; } // server wins on duplicate ids within server
      } else {
        // Server item without an id — keep it (rare, shouldn't happen)
        byId['__noid_' + s] = srvItem; order.push('__noid_' + s);
      }
    }
    // Overlay local items — LOCAL WINS on id conflicts (local has the user's latest edit)
    for (var l = 0; l < localArr.length; l++) {
      var locItem = localArr[l];
      if (locItem && locItem.id !== undefined && locItem.id !== null) {
        var lidKey = String(locItem.id);
        if (!byId[lidKey]) { byId[lidKey] = locItem; order.push(lidKey); }
        else { byId[lidKey] = locItem; } // local overwrites server
      } else {
        byId['__noidlocal_' + l] = locItem; order.push('__noidlocal_' + l);
      }
    }
    // Rebuild the array in order
    merged[k] = [];
    for (var oi = 0; oi < order.length; oi++) {
      merged[k].push(byId[order[oi]]);
    }
  }
  // Non-array fields: local wins
  merged.company = (localDB.company && typeof localDB.company === 'object') ? localDB.company : (serverDB.company || {});
  merged._lastBackup = localDB._lastBackup || serverDB._lastBackup;
  merged._savedAt = new Date().toISOString();
  return merged;
}

// Safely parse a fetch response. If the server returns a non-JSON response
// (e.g., Vercel's plain-text "Request Entity Too Large" 413 error), this
// returns a structured error object instead of throwing a JSON parse error.
function safeParseFetchResponse(response) {
  if (!response.ok) {
    // HTTP error (4xx, 5xx) — read body as text to get the actual error message
    return response.text().then(function(text) {
      var errSummary = text.substring(0, 200);
      return { ok: false, status: response.status, error: errSummary };
    }).catch(function() {
      return { ok: false, status: response.status, error: 'HTTP ' + response.status };
    });
  }
  // Response is OK — try to parse as JSON
  return response.json().catch(function() {
    // JSON parse failed — read as text and return as error
    return response.text().then(function(text) {
      return { ok: false, error: 'Non-JSON response: ' + text.substring(0, 200) };
    }).catch(function() {
      return { ok: false, error: 'Invalid response' };
    });
  });
}

// Vercel's Hobby plan limits request body to 4.5MB. When the DB already
// contains many purchases with attachments, the total payload can exceed
// this limit. This function trims old attachment DATA (base64) from
// purchases/deliveries to bring the payload under the safe threshold.
//
// It keeps the attachment metadata (name, type, size) so the user still
// sees that an attachment existed — only the base64 `data` field is dropped.
// The most recent attachments are preserved; oldest are trimmed first.
//
// `keepRecentCount` — number of most-recent attachments to preserve (default 3).
// `maxBytes` — target maximum payload size (default 4MB, safely under Vercel's 4.5MB).
function trimLargePayload(payload, keepRecentCount, maxBytes) {
  keepRecentCount = keepRecentCount || 3;
  maxBytes = maxBytes || (4 * 1024 * 1024);  // 4 MB safe threshold

  var payloadStr = JSON.stringify(payload);
  if (payloadStr.length <= maxBytes) return payload;  // no trimming needed

  console.warn('trimLargePayload: payload is ' + (payloadStr.length / 1024 / 1024).toFixed(2) + ' MB, trimming old attachment data...');

  // Collect all attachments with their data, sorted by recency (newest first)
  var collections = ['purchases', 'deliveries', 'adjustments', 'damages'];
  var allAttachments = [];  // { ref: <object>, hasData: true }
  for (var ci = 0; ci < collections.length; ci++) {
    var coll = payload[collections[ci]];
    if (!Array.isArray(coll)) continue;
    for (var ii = coll.length - 1; ii >= 0; ii--) {
      var item = coll[ii];
      if (item.attachment && item.attachment.data) {
        allAttachments.push({ ref: item, attach: item.attachment });
      }
    }
  }

  // Keep the `keepRecentCount` most recent (already in reverse order), trim the rest
  var trimmedCount = 0;
  for (var ti = keepRecentCount; ti < allAttachments.length; ti++) {
    var a = allAttachments[ti].attach;
    // Keep name, type, size — drop only the large `data` field
    delete a.data;
    a.trimmed = true;  // mark so the UI can show "data no longer available"
    trimmedCount++;
    // Check if we're now under the limit
    if (JSON.stringify(payload).length <= maxBytes) break;
  }

  console.warn('trimLargePayload: trimmed ' + trimmedCount + ' old attachment(s). New size: ' + (JSON.stringify(payload).length / 1024 / 1024).toFixed(2) + ' MB');
  return payload;
}

function saveDBNow(onDone, options) {
  options = options || {};
  var skipMerge = options.skipMerge || false;
  // Cancel any pending debounced save — we're saving NOW, so the
  // debounced version is redundant (and might use different merge settings).
  // Without this, the debounced saveDB() timer fires 300ms later and calls
  // saveDBNow() WITHOUT skipMerge, which does GET-merge and re-adds deleted rows.
  if (DB_SAVE_TIMER) { clearTimeout(DB_SAVE_TIMER); DB_SAVE_TIMER = null; }
  try {
    var localPayload = buildDBSnapshot();
    // AUTO-TRIM: If the payload is too large for Vercel (4.5MB body limit),
    // automatically strip old attachment DATA (base64) while keeping metadata.
    // This prevents "File too large for server" errors when the DB has grown
    // large with many existing attachments.
    localPayload = trimLargePayload(localPayload);
    DB_LOCAL_DIRTY = false; // optimistic — set true again if save fails
    // Optimistically also cache in localStorage so the next page load
    // can paint quickly before the server round-trip completes.
    try { localStorage.setItem('itAssetDB', JSON.stringify(localPayload)); } catch (e) {}
    // Show "Saving..." indicator (subtle, non-blocking)
    showSaveStatusIndicator('saving');

    // If skipMerge is true (e.g., for large attachment saves), POST directly
    // without the GET-merge step. This avoids doubling the data transfer,
    // which can exceed Vercel's body size limit and cause "Network unexpected"
    // errors when attachments are involved.
    if (skipMerge) {
      fetch('/api/db', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: localPayload })
      }).then(function(r) { return safeParseFetchResponse(r); }).then(function(res) {
        if (res && res.ok) {
          DB_LAST_SAVED_AT = res.updatedAt || new Date().toISOString();
          showSaveStatusIndicator('saved');
        } else {
          console.warn('saveDB: server returned error', res);
          DB_LOCAL_DIRTY = true;
          var errMsg = (res && res.error) ? res.error : 'unknown error';
          // If it's a body-size error, show a helpful message
          if (errMsg.indexOf('too large') !== -1 || errMsg.indexOf('413') !== -1 || errMsg.indexOf('Entity Too Large') !== -1) {
            errMsg = 'File too large for server. Use a smaller file (max 1 MB).';
          }
          showSaveStatusIndicator('error', errMsg);
          showToast('Save failed: ' + errMsg, 'error');
        }
        if (onDone) onDone(res);
      }).catch(function(err) {
        console.warn('saveDB: network error', err);
        DB_LOCAL_DIRTY = true;
        var errMsg = err && err.message ? err.message : 'network error';
        // If it's a JSON parse error from a non-JSON response (e.g., Vercel 413),
        // show a more helpful message
        if (errMsg.indexOf('Unexpected token') !== -1 || errMsg.indexOf('is not valid JSON') !== -1) {
          errMsg = 'Server rejected the request (file may be too large). Use a smaller file (max 1 MB).';
        }
        showSaveStatusIndicator('error', errMsg);
        showToast('Save failed: ' + errMsg, 'error');
        if (onDone) onDone({ ok: false, error: errMsg });
      });
      return;
    }

    // STEP 1: GET the latest server DB so we don't overwrite other users' changes.
    // This is critical for multi-user scenarios — without it, a stale local DB
    // would overwrite purchases/records that other users just saved.
    fetch('/api/db', { method: 'GET' })
      .then(function(r) { return safeParseFetchResponse(r); })
      .then(function(getRes) {
        var serverDB = (getRes && getRes.ok && getRes.data) ? getRes.data : null;
        // STEP 2: Merge local items into the server DB (union by id, local wins)
        var mergedPayload = serverDB ? mergeDBWithServer(serverDB, localPayload) : localPayload;
        // AUTO-TRIM: After merge, the payload may be too large (server had old
        // attachments + local has new ones). Trim old attachment data to fit.
        mergedPayload = trimLargePayload(mergedPayload);
        // Update local DB with the merged result so subsequent saves are also safe
        applyDBData(mergedPayload);
        // STEP 3: POST the merged DB
        return fetch('/api/db', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: mergedPayload })
        });
      })
      .then(function(r) { return safeParseFetchResponse(r); })
      .then(function(res) {
        if (res && res.ok) {
          DB_LAST_SAVED_AT = res.updatedAt || new Date().toISOString();
          showSaveStatusIndicator('saved');
        } else {
          console.warn('saveDB: server returned error', res);
          DB_LOCAL_DIRTY = true; // restore dirty flag so we retry later
          var errMsg2 = (res && res.error) ? res.error : 'unknown error';
          if (errMsg2.indexOf('too large') !== -1 || errMsg2.indexOf('413') !== -1 || errMsg2.indexOf('Entity Too Large') !== -1) {
            errMsg2 = 'File too large for server. Use a smaller file (max 1 MB).';
          }
          showSaveStatusIndicator('error', errMsg2);
          showToast('Save failed: ' + errMsg2, 'error');
        }
        if (onDone) onDone(res);
      })
      .catch(function(err) {
        console.warn('saveDB: network error', err);
        DB_LOCAL_DIRTY = true; // restore dirty flag so we retry later
        var errMsg3 = err && err.message ? err.message : 'network error';
        if (errMsg3.indexOf('Unexpected token') !== -1 || errMsg3.indexOf('is not valid JSON') !== -1) {
          errMsg3 = 'Server rejected the request (file may be too large). Use a smaller file (max 1 MB).';
        }
        showSaveStatusIndicator('error', errMsg3);
        showToast('Save failed: ' + errMsg3, 'error');
        if (onDone) onDone({ ok: false, error: errMsg3 });
      });
  } catch (e) {
    console.warn('saveDB failed:', e);
    DB_LOCAL_DIRTY = true;
    showSaveStatusIndicator('error', 'Exception: ' + (e && e.message ? e.message : 'unknown'));
    showToast('Save failed: ' + (e && e.message ? e.message : 'unknown error') + '. Your changes are NOT saved.', 'error');
    if (onDone) onDone({ ok: false, error: e && e.message });
  }
}

// Show a small "Saving..." / "Saved" / "Error" indicator in the top bar.
// Helps the user see whether their changes have been persisted to the server.
// status: 'saving' | 'saved' | 'error'
function showSaveStatusIndicator(status, errorMsg) {
  var indicator = document.getElementById('save-status-indicator');
  if (!indicator) {
    // Create the indicator if it doesn't exist yet — inject into the top bar.
    indicator = document.createElement('div');
    indicator.id = 'save-status-indicator';
    indicator.style.cssText = 'position:fixed;bottom:14px;right:14px;z-index:99998;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;font-family:Outfit,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,0.18);display:flex;align-items:center;gap:8px;transition:opacity 0.3s;opacity:0;pointer-events:none;';
    document.body.appendChild(indicator);
  }
  // Clear any previous auto-hide timer
  if (indicator._hideTimer) { clearTimeout(indicator._hideTimer); indicator._hideTimer = null; }
  // Set appearance based on status
  if (status === 'saving') {
    indicator.style.background = 'rgba(45,138,78,0.95)';
    indicator.style.color = '#fff';
    indicator.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
    indicator.style.opacity = '1';
  } else if (status === 'saved') {
    indicator.style.background = 'rgba(45,138,78,0.95)';
    indicator.style.color = '#fff';
    indicator.innerHTML = '<i class="fas fa-check-circle"></i> Saved';
    indicator.style.opacity = '1';
    indicator._hideTimer = setTimeout(function() { indicator.style.opacity = '0'; }, 1500);
  } else if (status === 'error') {
    indicator.style.background = 'rgba(220,38,38,0.95)';
    indicator.style.color = '#fff';
    indicator.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + (errorMsg || 'Save failed');
    indicator.style.opacity = '1';
    indicator._hideTimer = setTimeout(function() { indicator.style.opacity = '0'; }, 5000);
  }
}

// Load DB from server. Falls back to localStorage cache if the server is unreachable.
// This is ASYNC — caller must continue in the callback.
//
// CRITICAL: the SERVER is always the source of truth.
// - On boot, we ALWAYS apply whatever the server returns (replacing localStorage cache).
// - We never push local data to the server during boot — that would overwrite other
//   browsers' changes. Local-to-server push only happens via saveDB() which is
//   called after a user action (Add/Edit/Delete), not on load.
//
// The only exception: if the server is unreachable, we fall back to the localStorage
// cache (best-effort) so the app remains usable offline.
function loadDB(onDone) {
  // Step 1: fetch the authoritative copy from the server FIRST
  fetch('/api/db', { method: 'GET' })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res && res.ok && res.data) {
        // Server is the source of truth — always apply server data
        applyDBData(res.data);
        DB_LAST_SAVED_AT = res.updatedAt || null;
        DB_LOCAL_DIRTY = false; // we just synced — no unsaved changes
        // Refresh the local cache so future loads are fast
        try { localStorage.setItem('itAssetDB', JSON.stringify(res.data)); } catch (e) {}
        DB_BOOT_DONE = true;
        if (onDone) onDone(true);
      } else {
        console.warn('loadDB: server returned error, falling back to localStorage cache', res);
        // Server returned an error — fall back to localStorage cache (best-effort)
        try {
          var cached = localStorage.getItem('itAssetDB');
          if (cached) {
            var cachedData = JSON.parse(cached);
            applyDBData(cachedData);
          }
        } catch (e2) { /* ignore */ }
        DB_BOOT_DONE = true;
        if (onDone) onDone(false);
      }
    })
    .catch(function(err) {
      console.warn('loadDB: network error, using cached/localStorage data', err);
      // Network error — fall back to localStorage cache (best-effort)
      try {
        var cached2 = localStorage.getItem('itAssetDB');
        if (cached2) {
          var cachedData2 = JSON.parse(cached2);
          applyDBData(cachedData2);
        }
      } catch (e3) { /* ignore */ }
      DB_BOOT_DONE = true;
      if (onDone) onDone(false);
    });
}

// Apply a data object to the global DB (replaces arrays but keeps shape)
function applyDBData(data) {
  if (!data || typeof data !== 'object') return;
  var keys = ['branches','employees','departments','designations','categories','brands','uoms','products','suppliers','conditions','warranties','purchases','deliveries','adjustments','damages','transfers','cashIn','cashOut','quotations','invoices','users','roles'];
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (Array.isArray(data[k])) DB[k] = data[k];
  }
  if (data.company && typeof data.company === 'object') DB.company = data.company;
  if (data._lastBackup) DB._lastBackup = data._lastBackup;
}

// Flush any pending save before the page unloads (refresh / close / navigate).
// Uses sendBeacon (works during unload) AND a synchronous XHR fallback to
// GUARANTEE the save completes before the browser navigates away — this is
// critical for attachment uploads which take longer than a simple text edit.
//
// CRITICAL: Before POSTing, this does a SYNC GET to fetch the latest server DB,
// then MERGES local items into it (union by id). This prevents the
// "last-write-wins" data loss where a stale local DB overwrites other users'
// recent changes on the server.
function flushPendingSave() {
  if (!DB_LOCAL_DIRTY) return;
  // Cancel the debounced timer — we're saving NOW
  if (DB_SAVE_TIMER) { clearTimeout(DB_SAVE_TIMER); DB_SAVE_TIMER = null; }
  var localPayload = buildDBSnapshot();
  // Always update localStorage first (synchronous, instant)
  try { localStorage.setItem('itAssetDB', JSON.stringify(localPayload)); } catch (e) {}

  // STEP 1: Sync GET the latest server DB so we can merge (prevents overwriting
  // other users' changes). This is the key fix for the "purchases auto-delete"
  // bug — without this, a stale local DB would overwrite purchases that other
  // users just saved.
  var mergedPayload = localPayload;  // fallback: just POST local if GET fails
  try {
    var getXhr = new XMLHttpRequest();
    getXhr.open('GET', '/api/db', false); // false = synchronous
    getXhr.send();
    if (getXhr.status === 200) {
      var getRes = JSON.parse(getXhr.responseText);
      if (getRes && getRes.ok && getRes.data) {
        mergedPayload = mergeDBWithServer(getRes.data, localPayload);
        // Update local DB with merged result so the next page load sees it
        applyDBData(mergedPayload);
      }
    }
  } catch (e) {
    // GET failed (network error) — fall back to just POSTing local payload
    console.warn('flushPendingSave: sync GET failed, using local payload only', e);
  }

  // STEP 2: POST the merged DB
  // Strategy 1: sendBeacon (fire-and-forget, works during unload)
  var beaconSent = false;
  if (navigator.sendBeacon) {
    try {
      var blob = new Blob([JSON.stringify({ data: mergedPayload })], { type: 'application/json' });
      beaconSent = navigator.sendBeacon('/api/db', blob);
    } catch (e) { beaconSent = false; }
  }

  // Strategy 2: Synchronous XHR — blocks the page unload until the save
  // completes. This is the ONLY way to guarantee attachments (which can be
  // large base64 blobs) are fully persisted before the page reloads.
  if (!beaconSent) {
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/db', false); // false = synchronous
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.send(JSON.stringify({ data: mergedPayload }));
    } catch (e) {
      // Last resort: async fetch with keepalive (may not complete)
      try {
        fetch('/api/db', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: mergedPayload }),
          keepalive: true
        });
      } catch (e2) {}
    }
  }

  // Strategy 3: Also fire an async fetch as backup (in case beacon silently fails)
  try {
    fetch('/api/db', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: payload }),
      keepalive: true
    });
  } catch (e) {}

  DB_LOCAL_DIRTY = false;
}

// Wire up flush-on-unload listeners (set up once, after the script loads)
if (!window._flushWired) {
  window._flushWired = true;
  // 'pagehide' is the most reliable cross-browser unload event
  window.addEventListener('pagehide', flushPendingSave);
  // 'beforeunload' fires earlier and gives sendBeacon more time
  // We return undefined (don't trigger the "Leave site?" prompt) —
  // the sync XHR inside flushPendingSave will block briefly but won't prompt.
  window.addEventListener('beforeunload', flushPendingSave);
  // 'visibilitychange' (hidden) fires on tab switch / minimize — good for mobile
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') flushPendingSave();
  });
}

// Clear saved data — used by "Delete All Data" button. Clears both server and localStorage.
function clearSavedDB(onDone) {
  try { localStorage.removeItem('itAssetDB'); } catch (e) {}
  // Tell server to reset to defaults by sending the empty/default DB
  var emptyDB = {
    branches: [], employees: [], departments: [], designations: [],
    categories: [], brands: [], uoms: [], products: [], suppliers: [],
    conditions: [], warranties: [], purchases: [], deliveries: [],
    adjustments: [], damages: [], transfers: [], cashIn: [], cashOut: [],
    users: DB.users,         // keep users so admin can still log in
    roles: DB.roles,         // keep roles too
    company: { name: '', address: '', phone: '', email: '', website: '' },
    _savedAt: new Date().toISOString()
  };
  fetch('/api/db', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ data: emptyDB })
  }).then(function(r) { return r.json(); }).then(function(res) {
    if (onDone) onDone(res);
  }).catch(function(err) {
    console.warn('clearSavedDB: network error', err);
    if (onDone) onDone({ ok: false, error: err && err.message });
  });
}

// Ensure at least one admin user exists in DB.users
// (called after loadDB so that previously-saved empty users list doesn't lock out the admin)
function ensureDefaultAdmin() {
  // Make sure DB.users is an array
  if (!Array.isArray(DB.users)) DB.users = [];
  // Look for the default admin user (by username 'admin')
  var adminExists = false;
  for (var i = 0; i < DB.users.length; i++) {
    if (DB.users[i].username && DB.users[i].username.toLowerCase() === 'admin') {
      adminExists = true;
      // Backfill password if missing (so old admin records can still log in)
      if (!DB.users[i].password) DB.users[i].password = 'admin123';
      if (!DB.users[i].role) DB.users[i].role = 'Super Admin';
      if (!DB.users[i].status) DB.users[i].status = 'Active';
      break;
    }
  }
  if (!adminExists) {
    DB.users.push({
      id: 1,
      name: 'Admin User',
      username: 'admin',
      email: 'admin@itassets.com',
      password: 'admin123',
      role: 'Super Admin',
      status: 'Active'
    });
  }
  // Also ensure default roles exist (so User Create form has options)
  // Migration: if roles have string permissions, migrate to object format
  var needsMigration = false;
  if (Array.isArray(DB.roles)) {
    for (var mi = 0; mi < DB.roles.length; mi++) {
      if (typeof DB.roles[mi].permissions === 'string') { needsMigration = true; break; }
    }
  }
  if (needsMigration) {
    // Convert old string-based permissions to new object-based permissions
    for (var mi2 = 0; mi2 < DB.roles.length; mi2++) {
      var roleName = DB.roles[mi2].name;
      var oldPerm = DB.roles[mi2].permissions;
      var newPerms = {};
      if (roleName === 'Super Admin' || oldPerm === 'Full Access') {
        newPerms.fullAccess = true;
      } else {
        // Try to map old string to module permissions (best-effort migration)
        var allModules = ['dashboard','branch','employee','product','purchase','inventory','cashbook','approval','report','settings'];
        for (var am = 0; am < allModules.length; am++) {
          // Default: grant view + add + edit + export (read-write)
          if (oldPerm && oldPerm.toLowerCase().indexOf(allModules[am]) !== -1) {
            newPerms[allModules[am]] = ['view', 'add', 'edit', 'export', 'print'];
          }
        }
        // Special case for "Viewer" role — read-only on dashboard + report
        if (roleName === 'Viewer') {
          newPerms = { dashboard: ['view'], report: ['view', 'print'] };
        }
      }
      DB.roles[mi2].permissions = newPerms;
    }
  }

  // Migration: convert legacy purchase statuses to the new Draft/Confirm flow.
  // Old statuses: 'Submitted' → 'Confirm' (means Approve Request sent).
  // 'Pending' stays as 'Pending' (still pending in approval queue).
  // 'Draft' stays as 'Draft' (user can still edit).
  // 'Approved' / 'Rejected' stay as-is.
  if (Array.isArray(DB.purchases)) {
    var purchaseStatusChanged = false;
    for (var pi = 0; pi < DB.purchases.length; pi++) {
      if (DB.purchases[pi].status === 'Submitted') {
        DB.purchases[pi].status = 'Confirm';
        purchaseStatusChanged = true;
      }
    }
    if (purchaseStatusChanged) {
      console.log('Migrated purchase statuses: Submitted → Confirm');
      saveDB();
    }
  }

  if (!Array.isArray(DB.roles) || DB.roles.length === 0) {
    DB.roles = [
      { id: 1, name: 'Super Admin', description: 'Full system access — can do everything', permissions: { fullAccess: true } },
      { id: 2, name: 'Admin',      description: 'System administration — all modules except settings', permissions: {
        dashboard: ['view','add','edit','delete','export','import','print'],
        branch: ['view','add','edit','delete','export','import'],
        employee: ['view','add','edit','delete','export','import'],
        product: ['view','add','edit','delete','export','import'],
        purchase: ['view','add','edit','delete','export','import','print'],
        inventory: ['view','add','edit','delete','export','print'],
        cashbook: ['view','add','edit','delete','export'],
        approval: ['view','add','edit','print'],
        report: ['view','print','export'],
        settings: ['view'] // Admin can view settings but not edit
      } },
      { id: 3, name: 'Manager',    description: 'Branch-level management — operations + reports', permissions: {
        dashboard: ['view'],
        branch: ['view'],
        employee: ['view','add','edit','export','import'],
        product: ['view','add','edit','export','import'],
        purchase: ['view','add','edit','export','print'],
        inventory: ['view','add','edit','print'],
        cashbook: ['view','add','edit','export'],
        approval: ['view','add','edit','print'],
        report: ['view','print','export']
      } },
      { id: 4, name: 'General User', description: 'Daily operations — limited to assigned tasks', permissions: {
        dashboard: ['view'],
        branch: ['view'],
        employee: ['view'],
        product: ['view'],
        purchase: ['view','add','export'],
        inventory: ['view','add','print'],
        cashbook: ['view','add'],
        report: ['view','print']
      } },
      { id: 5, name: 'Viewer',     description: 'Read-only access — can view reports and data', permissions: {
        dashboard: ['view'],
        report: ['view','print']
      } }
    ];
  }
}

  html += '</div>';
  html += '<div style="color:white;font-size:22px;font-weight:800;letter-spacing:0.5px;">Assets Management System</div>';
  html += '<div style="color:rgba(255,255,255,0.7);font-size:12px;font-weight:500;letter-spacing:2px;margin-top:4px;">SYSTEM</div>';

  html += '<i class="fas fa-user" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#6b7c6b;font-size:14px;"></i>';
  html += '<input type="text" id="login-username" placeholder="Enter your username" autocomplete="off" style="width:100%;padding:12px 14px 12px 40px;border:1.5px solid #d4ddd4;border-radius:10px;font-size:14px;font-family:Outfit,sans-serif;color:#1a2e1a;outline:none;transition:border-color 0.2s,box-shadow 0.2s;" onfocus="this.style.borderColor=\'#2d8a4e\';this.style.boxShadow=\'0 0 0 3px rgba(45,138,78,0.12)\'" onblur="this.style.borderColor=\'#d4ddd4\';this.style.boxShadow=\'none\'">';
  html += '</div>';
  html += '</div>';
  // Password
  html += '<div>';
  html += '<label style="display:block;font-size:12px;font-weight:600;color:#1a5c30;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;">Password</label>';
  html += '<div style="position:relative;">';
  html += '<i class="fas fa-lock" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#6b7c6b;font-size:14px;"></i>';
  html += '<input type="password" id="login-password" placeholder="Enter your password" autocomplete="off" style="width:100%;padding:12px 40px 12px 40px;border:1.5px solid #d4ddd4;border-radius:10px;font-size:14px;font-family:Outfit,sans-serif;color:#1a2e1a;outline:none;transition:border-color 0.2s,box-shadow 0.2s;" onfocus="this.style.borderColor=\'#2d8a4e\';this.style.boxShadow=\'0 0 0 3px rgba(45,138,78,0.12)\'" onblur="this.style.borderColor=\'#d4ddd4\';this.style.boxShadow=\'none\'">';
  html += '<i class="fas fa-eye" id="login-toggle-pass" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#6b7c6b;font-size:14px;cursor:pointer;" onclick="toggleLoginPassword()"></i>';
  html += '</div>';

  // Remember + forgot row
  html += '<div style="display:flex;align-items:center;justify-content:space-between;font-size:12px;">';
  html += '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:#6b7c6b;"><input type="checkbox" id="login-remember" checked style="cursor:pointer;accent-color:#2d8a4e;"> Remember me</label>';
  html += '<a href="#" onclick="showToast(\'Contact your administrator to reset password\',\'info\');return false;" style="color:#2d8a4e;font-weight:600;text-decoration:none;">Forgot password?</a>';
  html += '</div>';
  // Submit
  html += '<button type="submit" id="login-submit" style="margin-top:8px;padding:13px;background:linear-gradient(135deg,#2d8a4e 0%,#1a5c30 100%);color:white;border:none;border-radius:10px;font-size:14px;font-weight:600;font-family:Outfit,sans-serif;cursor:pointer;letter-spacing:0.5px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s;box-shadow:0 4px 12px rgba(45,138,78,0.25);">';

// Show/hide password on login screen
function toggleLoginPassword() {
  var pwd = document.getElementById('login-password');
  var icon = document.getElementById('login-toggle-pass');
  if (!pwd || !icon) return;
  if (pwd.type === 'password') {
    pwd.type = 'text';
    icon.classList.remove('fa-eye');
    icon.classList.add('fa-eye-slash');
  } else {
    pwd.type = 'password';
    icon.classList.remove('fa-eye-slash');
    icon.classList.add('fa-eye');
  }
}

// Attempt login with provided credentials
function attemptLogin() {
  var username = (document.getElementById('login-username').value || '').trim();
  var password = document.getElementById('login-password').value || '';
  var remember = document.getElementById('login-remember').checked;
  if (!username || !password) {
    showLoginError('Please enter both username and password');
    return;
  }
  // Find user
  var user = null;
  for (var i = 0; i < DB.users.length; i++) {
    if (DB.users[i].username && DB.users[i].username.toLowerCase() === username.toLowerCase() && DB.users[i].password === password) {
      user = DB.users[i];
      break;
    }
  }
  if (!user) {
    showLoginError('Invalid username or password');
    return;
  }
  if (user.status !== 'Active') {
    showLoginError('Account is ' + (user.status || 'inactive') + '. Contact administrator.');
    return;
  }
  // Success — set current user and persist session if "remember me"
  currentUser = user;
  if (remember) {
    try { localStorage.setItem(SESSION_KEY, JSON.stringify({ userId: user.id, at: Date.now() })); } catch (e) {}
  } else {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  }
  // Remove login screen
  var ls = document.getElementById('login-screen');
  if (ls) ls.remove();
  // Update top bar with logged-in user
  updateTopBarUser();
  // Welcome toast
  showToast('Welcome, ' + (user.name || user.username) + '! 👋');
  // Re-render nav so permission filtering takes effect for this user
  renderNav();
  // If the user doesn't have view permission for the dashboard, redirect them
  // to the first module (or submenu) they CAN view.
  if (!can('dashboard', 'view')) {
    var firstAllowed = null;
    // Check parent modules first
    outer: for (var i = 0; i < NAV.length; i++) {
      if (can(NAV[i].id, 'view')) { firstAllowed = NAV[i].id; break; }
      // If parent itself is not viewable, check children — a user might have
      // perms on a submenu without perms on the parent (e.g. only 'delivery-list')
      if (NAV[i].children) {
        for (var j = 0; j < NAV[i].children.length; j++) {
          if (can(NAV[i].children[j].id, 'view')) {
            firstAllowed = NAV[i].children[j].id;
            break outer;
          }
        }
      }
    }
    if (firstAllowed) {
      navigate(firstAllowed);
    } else {
      // User has no view permissions at all — show access denied
      currentPage = 'dashboard';
      renderPage();
    }
  } else {
    // Render the first page (dashboard)
    renderPage();
  }
}

// Display an error message on the login form
function showLoginError(msg) {
  var existing = document.getElementById('login-error-msg');
  if (existing) existing.remove();
  var form = document.getElementById('login-form');
  if (!form) return;
  var err = document.createElement('div');
  err.id = 'login-error-msg';
  err.style.cssText = 'background:rgba(220,38,38,0.08);border:1px solid rgba(220,38,38,0.30);color:#dc2626;padding:10px 12px;border-radius:8px;font-size:12px;display:flex;align-items:center;gap:8px;margin-bottom:4px;';
  err.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + msg;
  form.insertBefore(err, form.firstChild);
  // Shake the password field for feedback
  var pwd = document.getElementById('login-password');
  if (pwd) { pwd.value = ''; pwd.focus(); }
}

// Restore session from localStorage (called on page load)
function restoreSession() {
  try {
    var raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return false;
    var data = JSON.parse(raw);
    if (!data || !data.userId) return false;
    for (var i = 0; i < DB.users.length; i++) {
      if (DB.users[i].id === data.userId) {
        // Verify account is still active
        if (DB.users[i].status === 'Active') {
          currentUser = DB.users[i];
          return true;
        }
        localStorage.removeItem(SESSION_KEY);
        return false;
      }
    }
    // User no longer exists — clear stale session
    localStorage.removeItem(SESSION_KEY);
    return false;
  } catch (e) {
    return false;
  }
}

// Update the top bar to show the logged-in user
function updateTopBarUser() {
  var avatarEl = document.getElementById('topbar-user-avatar');
  var nameEl = document.getElementById('topbar-user-name');
  var roleEl = document.getElementById('topbar-user-role');
  if (!currentUser) return;
  var initials = '';
  if (currentUser.name) {
    var parts = currentUser.name.trim().split(/\s+/);
    initials = (parts[0] ? parts[0][0] : '') + (parts[1] ? parts[1][0] : '');
    initials = initials.toUpperCase();
  } else if (currentUser.username) {
    initials = currentUser.username.substring(0, 2).toUpperCase();
  }
  if (avatarEl) avatarEl.textContent = initials;
  if (nameEl) nameEl.textContent = currentUser.name || currentUser.username || 'User';
  if (roleEl) roleEl.textContent = currentUser.role || 'User';
}

// Logout — clear session and show login screen
function logoutUser() {
  // Confirm before logout
  if (!confirm('Are you sure you want to sign out?')) return;
  currentUser = null;
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  // Show the login screen again
  renderLoginPage();
  // Clear top bar user info
  var avatarEl = document.getElementById('topbar-user-avatar');
  var nameEl = document.getElementById('topbar-user-name');
  var roleEl = document.getElementById('topbar-user-role');
  if (avatarEl) avatarEl.textContent = '—';
  if (nameEl) nameEl.textContent = 'Not signed in';
  if (roleEl) roleEl.textContent = '';
  showToast('Signed out successfully');
}

// Show a small dropdown with current user info (placeholder — could link to profile)
function showUserMenu() {
  if (!currentUser) { renderLoginPage(); return; }
  showToast('Signed in as: ' + (currentUser.name || currentUser.username) + ' (' + currentUser.role + ')', 'info');
}

// ==================== BOOT ====================
// Show a brief loading splash while we fetch the latest DB from the server.
// This makes the app feel responsive even when the network is slow, and
// ensures the user sees fresh data on every load (cross-browser/cross-device).

function showBootSplash() {
  if (document.getElementById('boot-splash')) return;
  var splash = document.createElement('div');
  splash.id = 'boot-splash';
  splash.style.cssText = 'position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#0f1f0f 0%,#1a2e1a 50%,#2d4a2d 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:white;';
  splash.innerHTML = ''
    + '<div style="width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.25);">'
    + '<i class="fas fa-microchip" style="font-size:30px;"></i>'
    + '</div>'
    + '<div style="font-size:18px;font-weight:700;letter-spacing:0.5px;">Assets Management System</div>'
    + '<div style="display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(255,255,255,0.7);">'
    + '<div style="width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;"></div>'
    + 'Loading data from server...'
    + '</div>'
    + '<style>@keyframes spin{to{transform:rotate(360deg);}}</style>';
  document.body.appendChild(splash);
}

function hideBootSplash() {
  var splash = document.getElementById('boot-splash');
  if (splash) splash.remove();
}

// Start the boot sequence
showBootSplash();
loadDB(function() {
  try {
    // Server data loaded (or fallback used) — finish booting
    ensureDefaultAdmin();
    var sessionRestored = restoreSession();
    // Force the #app container to be visible (in case any prior state hid it)
    var appEl = document.getElementById('app');
    if (appEl) appEl.style.display = 'flex';
    // Render the sidebar nav so the menu is visible immediately
    renderNav();
    if (sessionRestored) {
      // If user can't view dashboard, redirect to first allowed page/submenu
      if (!can(currentPage, 'view')) {
        var firstAllowedBoot = null;
        outer_boot: for (var i = 0; i < NAV.length; i++) {
          if (can(NAV[i].id, 'view')) { firstAllowedBoot = NAV[i].id; break; }
          if (NAV[i].children) {
            for (var j = 0; j < NAV[i].children.length; j++) {
              if (can(NAV[i].children[j].id, 'view')) {
                firstAllowedBoot = NAV[i].children[j].id;
                break outer_boot;
              }
            }
          }
        }
        if (firstAllowedBoot) {
          currentPage = firstAllowedBoot;
        }
      }
      updateTopBarUser();
      renderPage();
      hideBootSplash();
    } else {
      // Not logged in — don't renderPage() since the user has no perms and
      // would see "Access Denied". Just show the login overlay.
      renderLoginPage();
      hideBootSplash();
    }
  } catch(e) {
    console.error('Boot error:', e);
    // Even on error, show the login page so the user isn't stuck on a black screen
    var appEl2 = document.getElementById('app');
    if (appEl2) appEl2.style.display = 'flex';
    try { renderNav(); } catch(e2) {}
    hideBootSplash();
    renderLoginPage();
  }
});
</script>
