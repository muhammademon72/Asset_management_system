# Deploy to Vercel on every push to main.
#
# This workflow requires the following repo secrets (set in
# GitHub → Settings → Secrets and variables → Actions):
#   - VERCEL_TOKEN         — a Vercel personal access token (https://vercel.com/account/tokens)
#   - VERCEL_ORG_ID        — your Vercel org/team ID
#   - VERCEL_PROJECT_ID    — the Vercel project ID (shown after first import)
#
# Once the secrets are set, every push to main auto-deploys to Vercel.
# If you've already linked the GitHub repo to Vercel via the dashboard,
# this workflow is OPTIONAL — Vercel's built-in GitHub integration already
# handles auto-deploy on every push. Use this only if you want CI checks
# (build status, deploy URL) inside GitHub Actions.

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  statuses: write

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1 | tee vercel-out.log | tail -n1)
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Vercel deployment URL: $DEPLOY_URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Summary
        run: |
          echo "## 🚀 Vercel Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** ${{ github.event.head_commit.message }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Author:** ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
